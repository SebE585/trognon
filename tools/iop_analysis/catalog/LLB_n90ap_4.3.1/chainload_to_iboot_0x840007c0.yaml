function_name_apple: null
function_name_assigned: "LLB's own image3 chainload call into iBoot, and its never-return guard"
decode_mode: thumb
subsystem: iboot_platform
entry_code_address: "0x840007fc"
thumb_entry_pointer: "0x840007fd"

review:
  status: partial
  reviewed_ranges:
    - ["0x840007c0", "0x84000820"]
    - ["0x8400caa0", "0x8400cacc"]
  resolved:
    - id: LLB90-CHAIN-Q1
      by: >
        Resolves part of IBSS90-RST-Q6/IBOOT90-DISP-Q3 (whether LLB's handoff to iBoot is itself traceable).
        Found by a raw byte search for the image3 type tag "tobi" (the reversed 'iBot' tag already seen in
        this iBoot's own img3 header, LLB_n90ap_4.3.1/tool_coverage.json) inside the LLB body: a single hit at
        file offset 0x80c, loaded as a 4-byte little-endian literal (0x69626f74) by a tiny wrapper at
        0x840007fc (`movs r1,2; ldr r0,[tobi_literal]; bl 0x840007c0`), which is this fiche's own
        entry_code_address. This is the call this project was looking for.
      proof_needed: null
    - id: LLB90-CHAIN-Q2b
      by: >
        Finds something more promising than the generic image3 I/O pipeline: BEFORE the "tobi" chainload call
        (LLB90-CHAIN-001) is ever reached, LLB's own main() (0x840008f4, the ".LLB start." string's function)
        runs a power-button debounce/confirmation gate. It reads a power-status bitfield (via a shared helper
        at 0x84005bc4, consumed by both 0x84005c2c and 0x8400d8f0), and if a bounded retry loop (callsite
        0x8400099c-0x840009d2) never sees that confirmation condition settle, it prints
        "Power on canceled.." (string present, LLB90-CHAIN-004 below) and calls 0x8400c01c, which clears a
        flag, calls what looks like a power-rail control function (0x84000820, the same GPIO-shaped setter
        already seen wrapping 0x8400580c), calls another cleanup function (0x84005d78), and ends in an
        infinite self-loop (`b $$`, 0x8400c038) -- i.e. a genuine power-down/halt sequence, not a crash. Only
        if this gate is satisfied does control reach 0x840009d4 and, two calls later, the "tobi" chainload
        (0x840009dc: `bl 0x840007fc`).
      proof_needed: "trace 0x84005bc4 fully to know exactly which bitfield/condition this gate checks, and
        whether a boot_ibss()-triggered watchdog reset (no physical hand on the power button, unlike a real
        cold boot) would plausibly fail to satisfy it -- see LLB90-CHAIN-Q3"
    - id: LLB90-CHAIN-Q3
      by: >
        CONFIRMED by a live hardware test (hardware_tests below): the same patched boot_ibss() attempt that
        produced a silent white screen on every prior try (3/3, two without any button held, one with Home
        held) instead reached USB Recovery Mode (PID 0x1281) cleanly when the physical Power button was held
        throughout -- the first time this project has seen the iPhone 4 do what the 3GS has always done on this
        same patch. LLB's power-button debounce gate (LLB90-CHAIN-Q2b) was the real blocker: the exploit
        sequence never simulates a physical button press, so every prior attempt hit "Power on canceled.." and
        powered itself off before ever reaching the "tobi" chainload into iBoot. This resolves IBSS90-RST-Q6's
        central question for the USB-silence half of the symptom. The screen ALSO showed the Apple boot logo
        on this run (user-observed, after an initial report of "white" that the user corrected once they
        looked again) -- not blank/unpainted at all: real boot graphics were drawn, which is a materially
        better and more informative result than "white screen" suggested. This is consistent with LLB and
        iBoot both actually running their normal boot-logo path (distinct from pinot_init()'s own panel-ID-SPI
        probe, IBOOT90-DISP-Q2) all the way through, on real hardware, for the first time this project has
        observed it on this board.
  unresolved:
    - id: LLB90-CHAIN-Q2
      text: >
        Whether this exact call chain actually completes successfully (reads the real image3 from NOR,
        decrypts/validates it, and reaches the final `blx r6`) now that LLB90-CHAIN-Q3 confirms the power-
        button gate upstream of it is satisfiable and was the real earlier blocker. Not independently traced
        to a concrete pass/fail outcome of its own -- the live test that resolved Q3 shows the OVERALL chain
        succeeds (USB Recovery Mode reached), which strongly implies this pipeline also succeeded, but was not
        instrumented separately.
      proof_needed: "largely superseded by the Q3 hardware test; would still need separate tracing or
        instrumentation to confirm in isolation, now low priority"

claims:
  - id: LLB90-CHAIN-001
    text: >
      `0x840007c0` builds a 2-word struct on its own stack (`[sp]=0x100000` size, `[sp+4]=0x4ff00000` a
      staging address literal read from its own pool at `0x840007f8`), then calls the generic image3 loader
      `0x8400fb98(dst=&struct, size_ptr=sp, type="tobi")`. If that returns non-zero, it calls
      `0x8400caa0(retry_or_mode=2, loaded_ptr=[sp+4])`.
    status: device_disassembly_verified
    evidence: "r2 -a arm -b 32 -m 0x84000000 -e asm.bits=16, pd on 0x840007c0 and its wrapper 0x840007fc, on
      the GID-decrypted N90AP LLB body"

  - id: LLB90-CHAIN-002
    text: >
      `0x8400caa0` runs several unidentified preparation/cleanup calls (0x8400c9dc, 0x8400c040, 0x8400bda0,
      0x8400cecc, 0x8400dd38 -- not individually read this session, plausibly cache/MMU or peripheral
      quiesce steps, a known pre-handoff pattern in this project's other reset/boot-dispatch functions), then
      executes `blx r6` where r6 carries the address LLB staged the image3 at (0x4ff00000 going in, per
      LLB90-CHAIN-001 -- not independently confirmed unchanged by the loader, LLB90-CHAIN-Q2). Immediately
      after the `blx`, the very next instruction is `b $$` (an infinite self-loop at its own address,
      0x8400cacc): the same "this call must never return" guard idiom already seen at the end of both boards'
      iBSS reset/watchdog handlers (IBSS90-RST-003/-004) -- consistent project-wide convention, not a new
      pattern.
    status: device_disassembly_verified
    evidence: "same r2 invocation as LLB90-CHAIN-001, pd on 0x8400caa0"

  - id: LLB90-CHAIN-003
    text: >
      Resolves the apparent address mismatch between LLB90-CHAIN-001's staging address (0x4ff00000) and
      iBoot's own self-asserted load address (0x5ff00000, IBOOT90-DISP-001): iBoot's reset handler, read at
      its own 0x5ff00040 in pure ARM mode (the Thumb-mode decode of this exact range produces nonsense, same
      pitfall as the shared helper function found earlier this project -- base instruction set, not
      a new finding), is a position-independent self-relocating trampoline: `sub r0, pc, 0x48` computes its
      OWN actual current address (wherever it was staged, not assumed), compares it against the literal
      0x5ff00000; if different, it copies 0x35c00 bytes of itself from its current location to 0x5ff00000 in
      a tight word loop, then `bx`-jumps to the relocated copy; only then does it set up per-mode stack
      pointers and fall through toward `main()`. This means LLB does NOT need to stage iBoot exactly at
      0x5ff00000 for the handoff to work -- iBoot relocates itself wherever it lands, including the
      0x4ff00000 scratch address LLB actually uses. The staging-address difference is therefore explained and
      benign, not a sign of a broken or mismatched handoff.
    status: device_disassembly_verified
    evidence: "r2 -a arm -b 32 -m 0x5ff00000 -e scr.color=0 (ARM mode, no asm.bits=16), pd on 0x5ff00040
      through 0x5ff00074 on the GID-decrypted N90AP iBoot body"

  - id: LLB90-CHAIN-004
    text: >
      The string "Power on canceled.." is present in this LLB body and is printed exactly once, on the path
      described in LLB90-CHAIN-Q2b: a bounded debounce retry loop in main() that gives up without the power
      button confirmation it is checking for. The function it calls next, 0x8400c01c, is a clean power-down
      sequence (clear a flag; call a power-rail-shaped GPIO setter, 0x84000820; call a further cleanup
      function, 0x84005d78; `b $$`), not a crash handler -- consistent with this being LLB's intentional,
      documented-by-design protection against a brief/accidental power-button press, not a bug.
    status: device_disassembly_verified
    evidence: "r2 -a arm -b 32 -m 0x84000000 -e asm.bits=16, izz for \"Power on canceled\" plus pd on
      0x840008f4 (LLB's main(), the \".LLB start.\" function), 0x84005c2c, 0x8400d8f0 and 0x8400c01c, on the
      GID-decrypted N90AP LLB body"

hardware_tests:
  - name: boot_ibss() patch attempt for the iPhone 4 (N90AP) -- 4th attempt, Power button held throughout
    claim_tested: "LLB90-CHAIN-Q2b/-Q3: whether LLB's power-button debounce gate, not any code bug, was the
      real blocker behind the three earlier silent white-screen attempts"
    execution_status: executed
    result: >
      Fresh DFU, limera1n pwn eventually succeeded (unusually flaky this run -- roughly 30 attempts total
      across two batches, well above the typical 1-3, with two mid-attempt libusb "no such device" errors;
      no evidence this was caused by the test method itself, confirmed by asking the user whether Power was
      already held during the pwn phase -- it was not), same two-byte patch as every prior attempt, sent and
      validated with NO USB error. Physical Power button (not Home, already tested without effect for
      IBSS90-RST-Q7) held continuously from just before the send. Outcome: the device reappeared in USB
      Recovery Mode (PID 0x1281) within the poll window -- the FIRST time this project has seen that on the
      iPhone 4 with this patch, matching the 3GS's own long-known behaviour. The screen showed the Apple boot
      logo (not blank/unpainted), a materially better result than the three earlier "white screen" attempts.
      3/3 silent-white-screen attempts without this exact condition (2 with no button, 1 with Home held) vs
      1/1 success with Power held throughout -- a sample of one success, but a complete behavioural change
      consistent with every static claim in this fiche (LLB90-CHAIN-Q2b/-Q3).
    evidence: "docs/journal/2026-10-22.md (not in this public repo); device's serial number/IMEI/ECID shown
      in the USB descriptor at the time were NOT recorded in this repository per project rule"

publication:
  status: approved
  notes: "call chain, a staging-address self-relocation mechanism, and a cross-reference to an existing
    project-wide convention; no firmware bytes, no device identifiers"
