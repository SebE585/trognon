      proof_needed: "tie each pointer table to its OSMetaClass registration (module init), or read the vtable pointer a constructor stores"
    - id: IOSLAVE-GETTER-Q2
      text: >
        Whether the +0x34c slot of the IOSlaveFirmware table is a kext function at all: in the other tables of
        this kext, slot +0x34c holds 0x801bcd69 (a kernel address, identical in four tables) or other kernel
        addresses. Their bodies are not read.
      proof_needed: "disassemble 0x801bcd68 in the kernelcache"

