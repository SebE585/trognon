    - id: IOSLAVE-GETTER-Q1
      text: >
        Class that owns the pointer table holding 0x8039901d at table offset +0x34c. The table starts at
        0x8039a678 by a heuristic (a run of 220 words that are kernel or kext pointers), not from a located
        vtable header. The OSMetaClass sizes of IOSLAVE-INIT-001 give IOSlaveFirmware 80 bytes, so a field at
