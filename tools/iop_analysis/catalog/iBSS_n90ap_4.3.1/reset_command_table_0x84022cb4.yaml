binary: ibss_decrypted.bin
binary_sha256: 147630a3259f07a427ac2390b49a7d94845865081c9bf6faacae72a23e7bb7dd
function_name_apple: null
function_name_assigned: "console command table entry for \"reset\", and its stock handler"
decode_mode: thumb
subsystem: iboot_platform
entry_code_address: "0x84022cb4"
thumb_entry_pointer: "0x84000cd5"

review:
  status: partial
  reviewed_ranges:
    - ["0x84022cb4", "0x84022cc8"]
    - ["0x84000cd4", "0x84000cf8"]
  resolved:
    - id: IBSS90-RST-Q1
      by: >
        Found by byte search (not disassembly) for the runtime pointer value of the "reset" string
        (0x8401d088 = LOAD_ADDRESS + its body offset), then searching the whole body for that 4-byte value as a
        pointer: exactly one hit, at 0x84022cb4, immediately followed at 0x84022cb8 by 0x84000cd5 (the handler,
        Thumb bit set). The next 16-byte-aligned slot (0x84022cc4) holds the pointer to the adjacent string
        "reboot" (0x8401d090) with the SAME handler pointer 0x84000cd5 -- cross-checked against the string table
        itself, where "reset\0" is immediately followed by "reboot\0\0reboot the device\0" (matches a
        console command table's usual {name, help} string layout).
    - id: IBSS90-RST-Q7b
      by: >
        Narrows (b) and revises IBSS90-RST-005's own simplification, read more carefully this session.
        Hypothesis (b) (a watchdog reset skips the button check) is now WEAKER: `main()` at 0x62c calls its
        button-reading block (0x642 onward) completely unconditionally, straight after three setup calls
        (0x66a4, 0x50a8, 0x509c) -- none of which branches around it or checks any reset-cause/status register
        first. No gate on reset cause was found anywhere between the shared reset vector and the button read.
        Separately, a watchdog/core-only reset is not expected to affect GPIO pad electrical state at all (only
        a full power cycle would), so the physical button level should read identically either way even if
        some such gate existed. Hypothesis (a) is REVISED rather than simply confirmed: IBSS90-RST-005's
        description of the dispatch ("reads a GPIO flag ... then dispatches on a device-index variable with
        three cases") undersold how indirect that path actually is. Read in full this session: the GPIO helper
        at 0x4e3c feeds into a two-stage debounce/confirmation loop (two more one-line GPIO-shaped helpers,
        0x4e28/0x4e14/0x4e5c, re-polled in a bounded loop from 0x696/0x6ca) that produces only a binary
        "forced-boot-device requested" sentinel (0 or -1, stored at [sp+4]); that sentinel is then ONE of four
        inputs (alongside three stack buffers) to a completely separate function, 0x5270, whose own first
        branch is a 15-way jump table keyed on a chip-revision/epoch byte read from MMIO 0xbf106000 bits
        [15:8] -- nothing to do with the button at all. The actual r4 used in the final `cmp r4,2`/`cmp r4,3`/
        `cmp r4,1` dispatch (0x72e-0x738) is read back from one of 0x5270's output pointers, not directly from
        the button sentinel. Whether (and how) the button sentinel actually steers that output through the
        chip-revision table was not traced to a conclusion this session -- this is a real, evidenced increase
        in how indirect and chip-revision-dependent the path is, not a simple relabelling of what was already
        known, and it is a far more plausible explanation for a hold-the-button test producing no visible
        effect than a wrong single button/pin identification would be.
      proof_needed: "trace 0x5270 (the chip-revision-keyed dispatch table) and its three output pointers fully,
        to establish whether and how the button sentinel at [sp+4] actually reaches the final device-index
        r4 -- a non-trivial undertaking (a 15-entry jump table keyed on silicon revision) that this session
        judged disproportionate to attempt in full without a clearer sign it would change the outcome"
  unresolved:
    - id: IBSS90-RST-Q2
      text: >
        How this table is actually walked (which function iterates it, with what loop/index, and in what
        register/stack context the handler at 0x84000cd5 is finally called -- argc/argv-shaped or otherwise).
        `axt` (radare2 cross-reference search) found no code reference to either table slot, nor to the string
        address, on this binary. The exact same search on the 3GS's own known-working equivalent entry
        (0x84017650/0x84017654, patched in dfuexec.py's n88ap_iBSS_435_patches and used successfully by
        boot_ibss() historically) gives the identical negative result -- so this is a known blind spot of this
        analysis method on this kind of table, not a sign that the N90AP table is structured differently.
      proof_needed: "either a disassembler with better indirect-call/computed-table resolution, or dynamic
        tracing on real hardware"
    - id: IBSS90-RST-Q6
      text: >
        What actually happens on real hardware between the watchdog-reset write (IBSS90-RST-003/-004) and the
        device settling into a solid white screen with no USB enumeration. Three candidate explanations ruled
        out so far: fault-handler divergence (IBSS90-RST-Q4), SecureROM boot-dispatch divergence
        (IBSS90-RST-Q5), and -- the most promising lead this session -- a broken or hanging display-init chain:
        LLB carries no display code at all (LLB_n90ap_4.3.1/boot_vector_and_no_display_0x84000000.yaml); iBoot
        does (gated on a panel-type byte, dispatching into pinot_init() for type 3,
        iBoot_n90ap_4.3.1/pinot_panel_init_0x5ff09d44.yaml); LLB's chainload call into iBoot and iBoot's own
        position-independent self-relocation trampoline are both read and sane
        (LLB_n90ap_4.3.1/chainload_to_iboot_0x840007c0.yaml); pinot_init() itself returns cleanly on every path
        traced, including its panel-ID-read failure path -- it does not hang (IBOOT90-DISP-Q2, resolved). Every
        piece of this chain that was read behaves correctly on paper. What is left is narrower and harder:
        whether LLB's own generic image3 read+validate I/O pipeline (not yet traced past its first two calls)
        actually succeeds in this exact post-watchdog-reset scenario, and ultimately whether any of this static
        reading reflects what the specific failing unit does at all.
      proof_needed: "see LLB90-CHAIN-Q2 and IBOOT90-DISP-Q4 (both in the LLB/iBoot_n90ap_4.3.1 fiches): trace
        the generic image3 I/O pipeline to a concrete outcome. The live hardware test this question used to
        point to (hold the GPIO button combo during the reset) has now been RUN (see hardware_tests below,
        3rd attempt): it made no observable difference. See IBSS90-RST-Q7 for what that negative result
        actually narrows down."
    - id: IBSS90-RST-Q7
      text: >
        Holding the physical button believed to drive the GPIO SecureROM polls (port 3 pin 2, IBSS90-RST-005)
        throughout a 3rd boot_ibss() attempt made NO observable difference versus the two earlier attempts
        without it (hardware_tests below): same silent white screen, no USB reappearance within 15s, all three
        times. Three non-exclusive candidate explanations, none yet distinguished: (a) the button/pin mapping
        itself is wrong -- "port 3 pin 2" was read from the SecureROM's device-index dispatch by static
        analysis (IBSS90-RST-005), never independently confirmed to be the physical Home button on this unit;
        (b) a watchdog-triggered internal reset may not re-poll this GPIO the way a full power-on reset does
        (many SoCs skip user-input checks on a warm/watchdog reset and always retake the same path regardless
        of button state) -- in which case holding the button could never have mattered, by design, for THIS
        specific reset trigger; (c) the white screen's actual cause lies earlier than the SecureROM's
        device-index dispatch altogether (e.g. in the ARM fault/exception itself, before the watchdog reset
        even fires, or in something common to every path regardless of device-index) -- which would mean
        IBSS90-RST-Q6's whole LLB/iBoot/display-chain line of investigation this session, while internally
        consistent, may be investigating a branch that was never actually reached.
      proof_needed: "static-read the exact condition that selects the watchdog-reset path in the first place
        (does it depend on device-index/button state at all, or is it unconditional on an uncaught fault?);
        and/or a live test that varies something OTHER than the button -- e.g. a short-timeout USB trace or a
        power-rail/backlight probe -- to tell apart 'no code ever reached iBoot' from 'iBoot ran but painted
        nothing', since holding the button no longer distinguishes between them."

claims:
  - id: IBSS90-RST-001
    text: >
      The command table entry for "reset" sits at body offset 0x22cb4 (absolute file offset 0x22cf4 in the full
      reconstructed image3, i.e. +64 for the img3 header), 16-byte-strided: word 0 = pointer to the name string
      ("reset", 0x8401d088), word 1 = pointer to the handler (0x84000cd5, Thumb), words 2-3 = 0. The structure is
      byte-identical in shape to the 3GS's own "reset" entry at body offset 0x17650 (same word layout, same
      "reboot" neighbour sharing the same handler, same {name, help} string pairing right after).
    status: device_disassembly_verified
    evidence: "r2 -a arm -b 32 -m 0x84000000 -e asm.bits=16 -c 'aaa; pdf @ ...' plus a direct byte search for the
      runtime pointer value, on the GID-decrypted N90AP iBSS (see boot_env_init_0x84000df0.yaml for how it was
      obtained)"

  - id: IBSS90-RST-002
    text: >
      In body-offset terms relative to decryptediBSS[64:] (the convention dfuexec.py's own n88ap_iBSS_435_patches
      uses), the two bytes to patch for an N90AP boot_ibss()-equivalent are: the "reset" string at body offset
      0x1d088 (overwrite with b'run\x00'), and the handler pointer at body offset 0x22c78 (overwrite with the
      4-byte little-endian value of LOAD_ADDRESS+1, 0x41000001).
    status: device_disassembly_verified
    evidence: "same as IBSS90-RST-001"

  - id: IBSS90-RST-003
    text: >
      Resolves IBSS90-RST-Q3. The UNPATCHED handler at 0x84000cd4 read to its end: `push {r7,lr}; add r7,sp,#0;
      bl 0x840155bc; movs r0,#0; bl 0x8401654c` -- no `pop`/return, because the second call never returns. It is
      a real hardware reset, not a placeholder: 0x840155bc is a conditional cleanup (checks a flag at
      *0x84028b88, and if set, calls two cleanup routines before clearing it); 0x8401654c, called with r0=0,
      skips its own optional branch and tail-calls 0x8400726c, which writes three words (unlock value
      0x80000000, then action code 4) to the MMIO block at 0x84007288/0x8400728c/0x84007290 pointing at
      0xbf102020/0xbf102024/0xbf10202c (watchdog/PMU block), then returns into an infinite self-loop
      (`b $$`) that waits for the reset to take effect.
    status: device_disassembly_verified
    evidence: "r2 -a arm -b 32 -m 0x84000000 -e asm.bits=16, af+pdf on 0x84000cd4, 0x840155bc, 0x8401654c and
      0x8400726c in sequence, on the GID-decrypted N90AP iBSS body"

  - id: IBSS90-RST-004
    text: >
      The 3GS's own unpatched "reset" handler (0x84000cdc, same table shape, see n88ap's own table at
      0x84017650/0x84017654) is structurally IDENTICAL to IBSS90-RST-003 above, instruction-for-instruction,
      down to its own final MMIO write sequence (same three-write unlock/action-code pattern, same relative
      offsets +0x10/+0x14/+0x1c from a watchdog/PMU base at 0xbf100200 -- vs N90AP's +0x20/+0x24/+0x2c from
      0xbf102000, consistent with a different register-block layout for this IP block between the two silicon
      generations, not a behavioural difference). This disproves IBSS90-RST-Q4's leading hypothesis (that the
      two boards' fault/reset handling code differs): it does not. Followed one level further, up the call
      chain from the shared vector table (both boards: identical ARM `ldr pc,[pc,#0x18]` x8 table at their
      respective 0x84000000, read via the literal pool at +0x20) through each board's prefetch-abort and
      data-abort stubs (byte-identical shape, only the target addresses of their `blx`/`bl` calls differ as
      expected) to the shared-shape panic-string formatter (which builds the well-known
      "ARM %s abort in %s mode at 0x%08x due to %s: far ... dfsr ... r0...sp...lr...spsr..." message, same on
      both boards, same literal pool strings for mode names "system"/"user"/"FIQ"/"IRQ"/"supervisor"/"abort"/
      "undefined") to its final call (`movs r0,1; bl <reset trigger>`): on BOTH boards that final call is
      exactly the same function already read for IBSS90-RST-003/the 3GS equivalent (N90AP: 0x8401654c: N88AP:
      0x8400e078). So an unrecoverable ARM fault (including a prefetch abort from jumping into unmapped memory,
      the patched "reset" command's actual effect) ends, by design, in the SAME hardware watchdog reset on both
      boards -- not in a USB Recovery fallback on one board and a silent hang on the other. The apparent
      difference observed on real hardware (N88AP historically falling back to USB Recovery Mode vs N90AP's
      white screen, hardware_tests below) is therefore NOT explained by anything in this iBSS binary's own
      code; see IBSS90-RST-Q5.
    status: device_disassembly_verified
    evidence: "same r2 invocation as IBSS90-RST-003, repeated on n88ap_body.bin (n88ap-iBSS-4.3.5's own
      decrypted body, GID key already cached from an earlier session) for the vector table, both abort stubs,
      the panic-string formatter and its final reset call; cross-checked against the n88ap IRQ/FIQ vector
      addresses already on record (0x8400f9ec/0x8400fa34, see TODO.md) which this same literal-pool read
      reproduced exactly"

  - id: IBSS90-RST-005
    text: >
      Went one level further down, outside iBSS entirely: dumped this iPhone 4's own SecureROM fresh
      (limera1n pwn + securerom_dump(), double-dumped and SHA-256-matched, 65536 bytes,
      4f34652a238a57ae0018b6e66c20a240cdbee8b4cca59a99407d09f83ea8082d -- same hash as the 2026-10-22 dump
      already on record, confirming reproducibility) and read its own boot entry statically (base 0x0, same
      ARM-vector-table-then-ldr-pc-literal-pool shape as iBSS, reset vector branching to a relocation/stack-init
      routine at 0x40 that ends in `bx` to the real `main()`). On the N90AP, `main()` (0x62c) reads a GPIO flag
      (port 3, pin 2, via the project's known `(8*port+pin)*4` convention against GPIO base 0xbfa00000) through
      a one-line helper at 0x4e3c, then dispatches on a device-index variable with exactly three live cases:
      1 = normal boot from "nor0" (calls a device lookup by that literal string, 0x81d4), 2 = an idle/button
      debounce loop (timeout 0x2710 = 10000, likely ms), 3 = DFU, which calls `usb_wait_for_image` directly
      (0x4c84 -- the exact same function this project's SHAtter-shellcode.S offset work already confirmed at
      0x4c85/Thumb earlier in this same session). The 3GS's own SecureROM (`SecureROM-359.3.2-RELEASE.dump`,
      already on disk from 2026-10-14, hash 0e6feb1144c95b1ee088ecd6c45bfdc2ed17191167555b6ca513d6572e463c86)
      has the SAME structure at its own `main()` (0x6ee, found via its own reset-vector chain, not assumed):
      same `cmp r4, 2`/`cmp r4, 3`/`cmp r4, 1` dispatch, same shape one-line GPIO-flag helper at the equivalent
      call site (0x4504) -- reading a DIFFERENT GPIO pin (port 0x15/21, pin 2, via a differently-addressed but
      same-shaped helper at 0x5c70), which is expected (board-specific button routing, not a code difference)
      and not itself informative. This disproves a second candidate explanation for IBSS90-RST-Q4/-Q6 (that the
      two boards' SecureROM boot-dispatch logic differs): it does not, beyond which physical GPIO pin each
      board wires its button(s) to.
    status: device_disassembly_verified
    evidence: "fresh limera1n pwn + dfuexec.PwnedDFUDevice().securerom_dump(), double-dumped same session (see
      hardware_tests below); r2 -a arm -b 32 -m 0x0 -e asm.bits=16, af+pdf on both dumps' reset vector, relocation
      routine and main(), scratchpad-only, never committed (docs/journal/2026-10-22.md)"

  - id: IBSS90-RST-006
    text: >
      Traced where the button sentinel described in IBSS90-RST-Q7b actually goes. It is passed, alongside three
      stack-buffer pointers (`[sp+0x1c]`, `[sp+0x18]`, `[sp+0x14]`, all inside main()'s own `sub sp,0x20` frame
      and never written before this call), into `0x5270(sentinel, &sp1c, &sp18, &sp14)`. That function's first
      action is a `cmp.w ip,0xe; bhi 0x529c` range check against a byte extracted from MMIO `0xbf106000` bits
      [15:8] (confirmed NOT the same register as the `CPRV:%02X` field in this SecureROM's own USB descriptor
      string, which instead comes from `0xbf50000c` via a different helper, 0x5420 -- these two silicon-ID-like
      fields are read from different hardware blocks and must not be conflated). If this byte is "bhi" the
      table's 15-entry range, `0x5270` returns immediately (r0=0) WITHOUT writing any of its three output
      pointers. Back in main(), the final dispatch value at `[sp+0x1c]` (loaded into r4 for the `cmp r4,2/3/1`
      comparison, 0x71e/0x72e-0x738) is therefore, on that branch, WHATEVER WAS ALREADY ON THE STACK at that
      address before the call -- nothing in main() between its own frame setup (`sub sp,0x20`, 0x634) and this
      call (0x708) ever initialises it. If that leftover value matches none of 1/2/3, control falls to 0x824,
      which checks the earlier button sentinel again: if it was -1 ("forced boot requested"), loops back to
      retry the whole 0x5270 call (`beq 0x700`); otherwise increments a counter and also loops (`b 0x6fe`) --
      either way, a retry loop that never reaches `nor0` (index 1) or `usb_wait_for_image` (index 3) unless the
      stack garbage or a later retry happens to land on one of those three values.
    status: device_disassembly_verified
    evidence: "r2 -a arm -b 32 -m 0x0 -e asm.bits=16, pd on main() 0x62c-0x824, on 0x5270's opening range check,
      and on the CPRV string-building code (0x8342-0x8384) and its 0x94d0/0x5420 call chain, to confirm it reads
      a DIFFERENT register than 0x5270's check -- all on the fresh N90AP SecureROM dump, scratchpad-only, never
      committed"

hardware_tests:
  - name: boot_ibss() patch attempt for the iPhone 4 (N90AP) -- 3rd attempt, Home button held throughout
    claim_tested: "IBSS90-RST-005's GPIO-button-gated SecureROM dispatch (device index 1=nor0/2=idle/3=DFU):
      whether holding the identified button forces SecureROM down branch 3 (DFU) instead of branch 1 (NOR)
      after the patch's watchdog reset"
    execution_status: executed
    result: >
      Fresh DFU, limera1n pwn confirmed (PWND:[limera1n]), same two-byte patch as the 1st/2nd attempts, sent
      and validated with NO USB error, Home held continuously from just before the send through 15s of
      polling afterwards. Outcome IDENTICAL to the 1st/2nd attempts without the button held: no USB
      reappearance (neither DFU 0x1227 nor Recovery 0x1281) within 15s, user-observed solid white screen.
      3/3 across all three attempts now (2 without the button, 1 with): holding this specific button makes NO
      observable difference to the outcome.
    evidence: "docs/journal/2026-10-22.md (not in this public repo)"
  - name: fresh limera1n pwn of this iPhone 4 (N90AP), standalone confirmation before the 3rd attempt
    claim_tested: "reproducibility of the pwn step itself"
    execution_status: executed
    result: >
      2 limera1n attempts failed outright (device stayed in plain, unpwned DFU -- a known flaky step on this
      exploit, not specific to this test), the 3rd succeeded (PWND:[limera1n]). Device remained in plain DFU
      between the failed attempts rather than disappearing, confirming the failures were the exploit itself
      not firing rather than any side effect on the device.
    evidence: "docs/journal/2026-10-22.md (not in this public repo)"
  - name: boot_ibss() patch attempt for the iPhone 4 (N90AP) -- 1st fresh-DFU attempt
    claim_tested: "IBSS90-RST-002"
    execution_status: executed
    result: >
      Pwn (limera1n, shared libusb context), decrypt, patch and send all succeeded with no USB error (158 KB
      patched iBSS fully accepted). Device screen went solid white; never appeared in USB Recovery Mode (0x1281)
      within 10s. No NOR write. Recovered by a full DFU power cycle.
    evidence: "docs/journal/2026-10-22.md (not in this public repo)"
  - name: boot_ibss() patch attempt for the iPhone 4 (N90AP) -- 2nd fresh-DFU attempt, same patch, no changes
    claim_tested: "IBSS90-RST-002"
    execution_status: executed
    result: "Identical outcome to the 1st attempt. 2/2: the white-screen result is systematic for this exact patch, not a one-off."
    evidence: "docs/journal/2026-10-22.md (not in this public repo)"
  - name: fresh SecureROM dump of this iPhone 4 (N90AP), double-dumped same pwned session
    claim_tested: "IBSS90-RST-005 (reproducibility of the dump this claim's static reading is based on)"
    execution_status: executed
    result: >
      1/1 fresh limera1n pwn, both dumps 65536 bytes, identical SHA-256
      (4f34652a238a57ae0018b6e66c20a240cdbee8b4cca59a99407d09f83ea8082d), matching the hash already on record
      from earlier the same day. Kept scratchpad-only, not committed.
    evidence: "docs/journal/2026-10-22.md (not in this public repo)"

publication:
  status: approved
  notes: "table layout, patch offsets and the cross-chip comparison; no firmware bytes, no device identifiers,
    no ECID/serial"
