review:
  status: complete
  reviewed_ranges:
    - ["0x80713020", "0x80713046"]
  unresolved:
    - id: ARM7M-ADDR-Q1
      text: >
        What the argument and the result are (an address in which address space, and whether -1 means failure),
        and who calls this method. The decoding is confirmed by the bytes (cmp r1,r0; it lo; mov.w r1,-1: an unsigned
        comparison, replacement when r1 < r0, as ARM defines LO). What is odd is the behaviour: for iop-version 1
        the result is replaced by -1 when the offset is BELOW the size, which is not an ordinary range check.
        The condition is not to be inverted to fit a presumed name. Host side (EMBIOP-SEQ-006): slot +0x35c of
        AppleARM7M's table at 0x8071409c is this method (verified: the word at 0x8071409c+0x35c is 0x80713021), and
        EmbeddedIOP calls that slot on its provider with the slot-+0x98 result of each IOP-visible allocation. So
        the argument is, by its use, a physical address and the result an address in the IOP's view. Reading of
        the numbers, unverified: 0x40000000 would be the RAM base, and -1 would mark an address inside the window
        [0, size) where the IOP sees the firmware image.
      proof_needed: "read how EmbeddedIOP treats a -1 result of the slot +0x35c call"

claims:
  - id: ARM7M-ADDR-001
    text: >
      A method (referenced from the table slot at 0x807143f8) takes one 32-bit argument and branches on
      this+0x64 (the iop-version value). For 1 it subtracts 0x40000000 from the argument, compares the result
      unsigned with the field at this+0x8c (the size field startCPU computes), and conditionally replaces it with
      -1; for 2 it subtracts 0x80000000; for any other value it returns the argument unchanged.
    status: device_disassembly_verified
    evidence: "docs/research/2026-10-16-iop-boot-to-life.md#who-starts-the-core-and-prepares-the-image"

