review:
  status: complete
  reviewed_ranges:
    - ["0x8075b980", "0x8075ba5c"]
  constant_ranges:
    - ["0x8075ba5c", "0x8075ba74"]
  unresolved:
    - id: PMU-GPIOFN-Q3
      text: >
        Observation, no explanation attached: the register is masked with 0x19 before the function bits are
        added, and only 0x02 or 0x04 are added, so the bits 0xE0 are always zero when the polarity-zero path
        tests them. The branch that logs "tried to set polarity on input" therefore looks unreachable in the
        flow as reconstructed.
      proof_needed: "re-read the instruction order at 0x8075b9e0..0x8075ba30; compare with the direction routine"

    - id: PMU-GPIOFN-Q1
      text: "Meaning of the preserved bits 0x19 (bits 0, 3 and 4) of the configuration register, and of function values 1 and 2 beyond 'sets bit 1' and 'sets bit 2'."
      proof_needed: "callers that pass function 2; the PMU datasheet, which is not available; behaviour on the device"
    - id: PMU-GPIOFN-Q2
      text: "Whether bit 1 is the output level in all configurations: the code flips it when the polarity flag is zero and the upper bits are zero, which reads as an inverted output, not as a level by itself."
      proof_needed: "a controlled observation of a PMU GPIO whose effect can be seen from outside"

claims:
  - id: PMU-GPIOFN-001
    text: >
      Arguments (this, pin, function, polarity flag). pin > 7 returns the error 0xe00002c2. Under the
      lock at this+0x9c it reads register 0x50 + pin; if the property gpio-pin-config was loaded
      (this+0xac) it replaces the bits selected by byte 2 of that pin's 4-byte entry with byte 3; it
      keeps bits 0x19; function 1 sets bit 0x02, function 2 sets bit 0x04, function 0 sets nothing,
      other values log "unsupported function" and return the error. A non-zero polarity flag then jumps
      straight to the write, with no message. Only on the polarity-zero path does it test the bits 0xE0:
      none set (the case in the reconstructed flow) flips bit 0x02, otherwise it logs "tried to set
      polarity on input, not supported" (see PMU-GPIOFN-Q3). It writes the register back. The byte written
      is rebuilt from (old with the overlay) & 0x19 plus the function bit, so it is not in general the old
      byte with a bit added.
    status: device_disassembly_verified
    evidence: "docs/research/2026-10-16-touch-n88-preconditions.md#pmu-gpio-and-ldo-functions-decoded-static-2026-10-16"

hardware_tests:
  - name: trace_pmu_read (STAGE 36), register 0x50
    claim_tested: "PMU-GPIOFN-001: layout of the configuration register of pin 0"
    execution_status: executed
    result: >
      Register 0x50 read 0x11: bit 1 and the bits 0xE0 are clear. This is the byte value only; no direction,
      polarity or electrical state is concluded from it, and the layout was not tested by changing the register.
    evidence: "evidence/20261016T164348Z-trace_pmu_read/"

  - name: trace_pmu_w34 (STAGE 39), write of register 0x50
    claim_tested: "PMU-GPIOFN-001 and PMU-GPIOAPPLY-002: the byte rebuilt as (old & 0x19) | 0x02 for pin 0"
    execution_status: executed
    result: >
      Register 0x50 read 0x11 and was written 0x13 (= (0x11 & 0x19) | 0x02), acknowledged, read back 0x13, still
      0x13 20 ms later, then written back 0x11 and read 0x11. This tests that the PMU takes the rebuilt byte; it
      does not test the polarity, the pin's electrical state or what the pin gates, and not that the touch driver
      writes this value (only that this is what the code computes).
    evidence: "evidence/20261016T173129Z-trace_pmu_w34/"

publication:
  status: approved
  notes: "register layout as read in code"
