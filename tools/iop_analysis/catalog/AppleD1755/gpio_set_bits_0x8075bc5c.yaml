  - id: PMU-GPIOBITS-001
    text: >
      Under the lock at this+0x9c, for a pin <= 7 and a non-zero mask it reads register 0x50 + pin,
      replaces the bits selected by the mask with the given value, and writes it back. If an extra
      argument is non-zero it also reads the three bytes at register 0x59, treats them as a packed
      24-bit word with a 3-bit field per pin (field position pin * 3), replaces the field and writes
      the three bytes back.
