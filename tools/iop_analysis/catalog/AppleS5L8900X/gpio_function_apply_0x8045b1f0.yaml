claims:
  - id: SOC-GPIOFN-001
    text: >
      The descriptor (pointer at this+0x1c) holds the pin word at offset 8 and bytes at offsets 0xc to 0xf.
      With a value pointer given, the function calls slot 0x398 of the controller with (pin word, level) where
      level = (byte +0xd XOR 1) XOR value, so a polarity byte of 1 gives level = value (active high) and a
      polarity byte of 0 gives level = NOT value (active low). With an output pointer it calls slot 0x39c
      and stores the level XOR (byte +0xd XOR 1).
    status: device_disassembly_verified
    evidence: "docs/research/2026-10-16-touch-n88-preconditions.md#the-soc-gpio-function-and-the-levels-of-the-touch-lines-static-2026-10-16"
  - id: SOC-GPIOFN-002
    text: >
      Default application (no value, no output pointer, no explicit type): if the type byte +0xc is 1, it
      calls slot 0x398 with level = byte +0xd XOR byte +0xe XOR 1, i.e. the level of an initial logical value
      byte +0xe under the same polarity rule; otherwise it calls slot 0x394 with the pin word only.
    status: device_disassembly_verified
    evidence: "docs/research/2026-10-16-touch-n88-preconditions.md#the-soc-gpio-function-and-the-levels-of-the-touch-lines-static-2026-10-16"
  - id: SOC-GPIOFN-003
    text: >
      Applied to the touch lines: function-reset (pin 14.01, flags 0x10001: bytes 01 00 01 00) has polarity 0
      and initial value 1, so a default level of 0 and, for a logical value 1, a level of 0, i.e. an
      active-low line asserted by default; function-spi_cs0 (13.00, flags 0x10001) has the same bytes and so the
      same rule; function-enable_cs of the touch node (13.00, flags 0x101: bytes 01 01 00 00) has polarity 1 and
      initial value 0, i.e. a default level of 0 as well. The levels read in STAGE 33 for 14.01 and 13.00 were
      both 0, consistent with these defaults; this is a consistency between a code reading and two reads, not a
      test of the polarity.
    status: device_disassembly_verified
    evidence: "docs/research/2026-10-16-touch-n88-preconditions.md#the-soc-gpio-function-and-the-levels-of-the-touch-lines-static-2026-10-16"

