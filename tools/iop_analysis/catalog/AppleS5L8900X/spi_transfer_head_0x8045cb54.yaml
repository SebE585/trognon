claims:
  - id: SPI-XFER-001
    text: >
      Before moving data, the function writes: CLKDIVIDER (0x30) with this+0xd8, SPIDD (0x38) with this+0xdc, STATUS
      (0x08) with this+0xac, SETUP (0x04) with this+0xd0, and CONTROL (0x00) with this+0xcc; it later writes SPCNT (0x34)
      with the transfer length (split into two parts when the length exceeds this+0xfc) and, for spi-version 1, register
      0x4c with one of those parts. For a transfer with receive data, SETUP is rewritten with bit 0x40 set. The head of
      the function also rejects a transfer when both a first and a second buffer object (this+0xb0 and 0xb4) are in
      use with the error 0xe00002d4.
    status: device_disassembly_verified
    evidence: "docs/research/2026-10-16-touch-n88-preconditions.md#the-spi-controller-driver-start-and-the-per-device-setting-static-2026-10-16"

