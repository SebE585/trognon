claims:
  - id: SPI-XFER-001
    text: >
      Before moving data, the function writes: CLKDIVIDER (0x30) with this+0xd8, SPIDD (0x38) with this+0xdc, STATUS
      (0x08) with this+0xac, SETUP (0x04) with this+0xd0, and CONTROL (0x00) with this+0xcc; it later writes SPCNT (0x34)
      with the transfer length (split into two parts when the length exceeds this+0xfc) and, for spi-version 1, register
      0x4c with one of those parts. For a transfer with receive data, SETUP is rewritten with bit 0x40 set. The head of
      the function also rejects a transfer when both a first and a second buffer object (this+0xb0 and 0xb4) are in
      use with the error 0xe00002d4.
    status: device_disassembly_verified
    evidence: "docs/research/2026-10-16-touch-n88-preconditions.md#the-spi-controller-driver-start-and-the-per-device-setting-static-2026-10-16"

  - id: SPI-XFER-002
    text: >
      Transmit-by-FIFO path: while fewer than this+0xa8 bytes (the FIFO depth: 16 for spi-version 1) have been
      written and bytes remain (this+0xfc), it writes one byte at a time to register 0x10 (TXDATA) from the buffer
      at this+0x10c. It then ORs 0x180 (and 0x200000 for spi-version 1) into a copy of the SETUP value
      (this+0xd4), writes SETUP with the result to start the transfer, and sleeps on the command gate until the
      byte this+0xe0 is non-zero.
    status: device_disassembly_verified
    evidence: "docs/research/2026-10-16-touch-n88-preconditions.md#the-spi-controller-driver-start-and-the-per-device-setting-static-2026-10-16"
  - id: SPI-XFER-003
    text: >
      End of a transfer: SETUP is rewritten with the base value this+0xd0 (the extra bits cleared), a wait of
      this+0xf0 units runs through an external function, then the chip select is released and the completion
      is reported through slot 0x364. The chip select is handled in one of two ways: if the byte this+0x94
      (the node property internal-cs) is set, by the controller's own method at slot 0x38c with a flag; otherwise
      by calling the chip-select function object stored at this+0xe8 (from function-spi_cs<n>) with the address
      of a local value, 1 near the start of the transfer and 0 at the end. The spi1 node has no internal-cs
      property, so for it the chip select is the function-spi_cs0 object (GPIO 13.00), not the PIN register.
    status: device_disassembly_verified
    evidence: "docs/research/2026-10-16-touch-n88-preconditions.md#the-spi-controller-driver-start-and-the-per-device-setting-static-2026-10-16"

