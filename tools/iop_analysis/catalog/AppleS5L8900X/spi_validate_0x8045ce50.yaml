    - id: SPI-VALID-Q1
      text: "Where the setting structure comes from: that its first word, its second word and the byte at offset 0xb are the first words of the 'reg' property of the SPI child node (the touch node's 0x0 0x7c 0x8010000 ...) is an inference from matching offsets, not shown by a call chain."
