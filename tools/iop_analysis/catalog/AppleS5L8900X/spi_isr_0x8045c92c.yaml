      text: "Which controller slots 0x394 and 0x398 are the TX-free and RX-count accessors: from the four small status accessors at 0x8045cabc..0x8045cb28 and the use of the results here they read as TX-free (slot 0x394) and RX-count (slot 0x398); the slot-to-function mapping was not read from the table."
