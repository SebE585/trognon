      text: "How clkG ultimately changes a hardware clock gate remains open. The earlier premise mixed two function objects: clkG installs table 0x804632b8, whose +0x50 method is 0x8045da44 and calls the receiver at this+0x18 through slot +0x354. The routine 0x8045da5c that uses this+0x1c and slot +0x380 belongs to table 0x80463200, installed by the ARST constructor, not the clkG object. The initializer 0x8045dbe0 obtains this+0x18 by safeMetaCast of this+8 with metaclass 0x80464688; the producer of this+8, its dynamic class and the implementation of +0x354 are not established."
