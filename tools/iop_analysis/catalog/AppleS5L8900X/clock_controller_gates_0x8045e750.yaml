claims:
  - id: S5L-CLK-001
    text: >
      The device tree's arm-io node carries function-clock_gate, 8 bytes: a phandle word and the selector 0x636c6b47 ("clkG" as a four-character code).
      AppleS5L8900XIO::start fails with "can't find 'function-clock_gate', update Device Tree" without it. A factory at 0x8045e504 compares the requested
      selector with 0x636c6b47 and, for it, allocates a 0x1c-byte object whose constructor (0x8045e140) installs the vtable 0x804632b8 (the class named
      AppleS5L8900XClockControllerFunctionClockGate); other selectors build the sibling function classes (assert-reset, turbo, performance advice).
    status: device_disassembly_verified
    evidence: "docs/research/2026-10-16-touch-n88-preconditions.md#where-the-iop-clock-gate-is-search-2026-10-16"
  - id: S5L-CLK-002
    text: >
      AppleS5L8900XClockController::start reads the device-tree properties clock-gate-defaults and clock-gate-suspend as 64-bit masks (two 32-bit
      words, stored at this+0x15c/0x160 and this+0x7a4/0x7a8) and writes them to the controller with the register-write virtual method (slot 0x374)
      at register offsets 0x48 and 0x4c, after masking the first with 0x7fcfffff. A warning string names the register "CGCON0" ("warning: asserting
      CGCON0 0x%08lx"). So the kernel's gating interface is a pair of 32-bit mask registers, one bit per gate number, not the per-gate words
      that the iBSS programs; neither property is present in this device tree (the node dump found only function-clock_gate).
    status: device_disassembly_verified
    evidence: "docs/research/2026-10-16-touch-n88-preconditions.md#where-the-iop-clock-gate-is-search-2026-10-16"
  - id: S5L-CLK-003
    text: >
      The device tree's clock-gates numbers of this phone range from 0x10 to 0x3b: dart0 0x2d, dart1 0x33, sdio 0x10, sha1 0x11, ceata 0x12,
      flash-controller0 0x13 and 0x14, spi0..2 0x15..0x17, uart0..4 0x1a..0x1e, pke 0x1f, i2c0 0x20, i2c2 0x22, pwm 0x23, otgphyctrl 0x24,
      usb-complex 0x25, iop 0x27, clcd 0x2a and 0x36, i2s0..2 0x39..0x3b. They exceed the 52 gate words the iBSS handles, and map to the iBSS and
      OpeniBoot's physical indexes by no constant offset (spi 0x15 to 9; the NAND controller 0x13 to 0x26; i2c0 0x20 to 0x13). The device tree used is
      N88AP (iPhone2,1).
    status: source_verified
    evidence: "docs/research/2026-10-16-touch-n88-preconditions.md#where-the-iop-clock-gate-is-search-2026-10-16"

  - id: S5L-CLK-004
    text: >
      Corrected attribution (2026-10-16): the clkG branch of the factory calls constructor 0x8045e140,
      which installs table 0x804632b8. Its +0x4c entry is initializer 0x8045dbe1; its +0x50 entry is
      0x8045da45. The initializer stores at this+0x18 the safeMetaCast result of the object at this+8
      with metaclass 0x80464688. The +0x50 method calls this+0x18 through slot +0x354 without loading
      a gate number from this+0x1c. The base initializer and concrete receiver remain untraced.
    status: device_disassembly_verified
    evidence: "docs/research/2026-10-16-touch-n88-preconditions.md#mission-s5l-clk-q1-correcting-the-function-object-attribution"
  - id: S5L-CLK-005
    text: >
      The factory branch for selector 0x41525354 (ARST) calls constructor 0x8045e048, which installs
      table 0x80463200. Its +0x54 entry points to 0x8045da5d, the routine that conditionally calls
      slot +0x380 of this+0x18 with the word at this+0x1c. That routine is not the clkG table's +0x50
      method. This corrects the earlier attribution; it establishes neither the final gate register
      mapping nor the runtime class of the clkG receiver.
    status: device_disassembly_verified
    evidence: "docs/research/2026-10-16-touch-n88-preconditions.md#mission-s5l-clk-q1-correcting-the-function-object-attribution"

