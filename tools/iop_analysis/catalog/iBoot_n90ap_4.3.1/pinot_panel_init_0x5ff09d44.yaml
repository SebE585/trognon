review:
  status: partial
  reviewed_ranges:
    - ["0x5ff02156", "0x5ff021a4"]
    - ["0x5ff09d44", "0x5ff09d98"]
  resolved:
    - id: IBOOT90-DISP-Q1
      by: >
        Resolves (for its iBoot half) IBSS90-RST-Q6 (reset_command_table_0x84022cb4.yaml): "where display/panel
        initialisation would plausibly live". It lives here, in iBoot, not in LLB (confirmed absent,
        LLB_n90ap_4.3.1/boot_vector_and_no_display_0x84000000.yaml) and not in iBSS/SecureROM's own executed
        paths (confirmed identical cross-chip, IBSS90-RST-004/-005). Found by string search for "pinot_init()."
        and "displaypipe_init" (both present in this iBoot's string table, izz), then locating the single
        literal-pool reference to each string's address and reading back to each reference's enclosing
        function. The enclosing function at 0x5ff02156+ reads device-tree properties ("display-color-space",
        "framebuffer"), builds a framebuffer object (`bl 0x5ff01d8c`), then reads a panel-type value at
        offset 0x44 of that framebuffer's root object: if it equals 3, it calls pinot_init (0x5ff09d44/Thumb
        0x5ff09d45) with that object and a stack pointer; otherwise it falls through to a different branch
        (not yet read -- a different panel driver, presumably a DIFFERENT value of that same byte for a
        different N90AP panel supplier/revision, not examined). `displaypipe_init` (0x5ff022f8, found the
        same way via its own string) has NO callers anywhere in this binary ('bl 0x5ff022f8' does not occur) --
        it is present but dead code on this specific build, a leftover of Apple's shared display-pipe source
        tree reused across several device families; pinot_init is the one actually reachable from the panel
        dispatch above.
      proof_needed: null
    - id: IBOOT90-DISP-Q2
      by: >
        Read pinot_init() (0x5ff09d44) in full, to its own `pop {r4,r5,r6,r7,pc}` at 0x5ff09f10. It does NOT
        hang or spin on a panel-ID-read failure: the read call (0x5ff0e968) is checked (`cbnz`/retry-counter
        `cmp r3,2`), and on failure it simply logs "pinot_init(): read of pinot panel id failed." (`bl
        0x5ff2a0a4`, the same logging/printf-style call used for every other "pinot_init()..." trace line in
        this function) and falls straight through to the common continuation point at 0x5ff09e4c -- the exact
        same place the SUCCESS path rejoins. From there the function proceeds unconditionally through more
        GPIO-shaped calls, backlight-level logic (byte at [r4+1] compared against 3/7/8, gating a call to
        0x5ff0e920 and 0x5ff01eb8) and a final GPIO write (`bl 0x5ff023dc`, arg 0x207), and returns normally
        on every path traced. No branch anywhere in this function loops back on itself other than the panel
        read's own bounded (<=2) retry counter.
    - id: IBOOT90-DISP-Q3b
      by: >
        The staging-address question this entry originally listed under -Q3 (whether LLB really hands iBoot
        off at 0x5ff00000) is resolved and cross-referenced: LLB actually stages iBoot's raw image3 at
        0x4ff00000, not 0x5ff00000 (LLB_n90ap_4.3.1/chainload_to_iboot_0x840007c0.yaml, LLB90-CHAIN-001). This
        is not a mismatch: iBoot's own reset handler at its self-asserted 0x5ff00040 is a position-independent
        self-relocating trampoline (same fiche, LLB90-CHAIN-003) that copies itself to 0x5ff00000 from
        wherever it actually was staged before falling through to per-mode stack setup and `main()`. The
        handoff's correctness therefore does not depend on LLB's staging address matching iBoot's literal
        pool at all.
  unresolved:
    - id: IBOOT90-DISP-Q4
      text: >
        Whether this call chain (device-tree panel-type==3 dispatch -> pinot_init) is actually reached on THIS
        specific white-screen hardware test (IBSS90-RST-Q6's hardware_tests). The handoff MECHANISM is now
        understood and sane end to end (LLB's chainload call, LLB90-CHAIN-001/-002; iBoot's self-relocation,
        LLB90-CHAIN-003; pinot_init()'s own control flow, IBOOT90-DISP-Q2) -- every piece read so far behaves
        correctly on paper, on both the success and the panel-read-failure path. What remains genuinely open is
        narrower than before: whether LLB's generic image3 read+validate pipeline (0x8400fb98 and what it
        calls, LLB90-CHAIN-Q2) actually succeeds on real hardware in this exact post-watchdog-reset scenario --
        a question static reading alone cannot settle without tracing considerably more of that generic I/O
        pipeline, and even then only a live hardware test confirms what actually happens on the specific
        failing unit.
      proof_needed: "either trace LLB90-CHAIN-Q2's generic image3 pipeline to a concrete pass/fail outcome, or
        move to live instrumentation of the actual white-screen hardware test (e.g. a debug/verbose boot-args
        string, if this iBoot build supports one, or a logic probe on the LCD control lines, or simply the
        already-identified GPIO-button DFU-forcing test from IBSS90-RST-005/-Q6)"

claims:
  - id: IBOOT90-DISP-001
    text: >
      This iBoot's own ARM vector table at its own base confirms its load/run address is 0x5ff00000, not
      0x84000000 (LLB's address, and the DFU-staging address used throughout this project so far) -- found
      directly from its own literal pool (0x5ff00040, 0x5ff18aac, 0x5ff18ae4, 0x5ff18b1c, 0x5ff18b58,
      0x5ff18b90, 0x5ff18a1c, 0x5ff18a64, all inside this 221184-byte body), not assumed by analogy. This is
      the first binary this project has read whose own natural runtime address differs from 0x84000000.
    status: device_disassembly_verified
    evidence: "python3 struct.unpack on the first 0x40 bytes of iboot_decrypted.bin, cross-checked by r2 -m
      0x5ff00000 disassembly of the same vector table"

  - id: IBOOT90-DISP-002
    text: >
      iBoot (not LLB, not iBSS/SecureROM's own executed code paths) is where N90AP panel/display
      initialisation lives, gated on a panel-type byte read from a device-tree-derived framebuffer object:
      type 3 dispatches into pinot_init(), which pulses a GPIO (likely the panel reset line), delays twice,
      then probes the panel over what is almost certainly SPI (matching existing "pinot-panel-id" /
      "raw-panel-id" device-tree keys) with a named, loggable failure path
      ("pinot_init(): read of pinot panel id failed"). This is new ground for the project: no prior fiche in
      this catalog (iBSS or SecureROM, either chip) has read any display-touching code, because neither
      binary's EXECUTED path touches the screen (IBSS90-RST-004/-005) even though iBSS's own string table
      does carry dead/unreached display strings of its own (not yet traced to a live call site the way this
      fiche traced iBoot's).
    status: device_disassembly_verified
    evidence: "r2 -a arm -b 32 -m 0x5ff00000 -e asm.bits=16, string search (izz) for 'pinot_init' and
      'displaypipe_init', /v4 literal-pool search for each string's address, pd around each reference and its
      enclosing function -- see docs/journal/2026-10-22.md for the exact transcript (not in this public repo)"

