claims:
  - id: IOP-GETMD-001
    text: >
      A lazy getter: if the field at this+0x50 is zero, it calls the external function 0x801ea699 with
      (0x80481000, 0x1b000, 3), stores the result at this+0x50, calls the result's vtable slot +0xa0 with
      (result, 0), and returns this+0x50. 0x80481000 is the start of the fwFirmwareImage segment of this kext
      and 0x1b000 (110592) its size, equal to the size of the extracted fwFirmwareImage.bin. It is the
      +0x34c entry of the instance table (0x80480614) installed by the IOP_s5l8920x_firmware constructor.
    status: device_disassembly_verified
    evidence: "docs/research/2026-10-16-iop-boot-to-life.md#who-starts-the-core-and-prepares-the-image"

