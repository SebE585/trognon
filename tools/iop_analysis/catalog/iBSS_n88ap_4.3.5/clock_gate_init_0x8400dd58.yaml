claims:
  - id: IBSS-CLK-001
    text: >
      The routine at 0x8400dd04 takes a 64-bit mask (r1:r0) and a flag (r2). For each bit i from 0 to 0x33 (52 gates) that is set it
      sets (flag nonzero: OR 0xF) or clears (flag zero: AND NOT 0xF) the word at 0xBF100078 + 4 * i, leaving the other bits of the word.
    status: device_disassembly_verified
    evidence: "docs/research/2026-10-16-touch-n88-preconditions.md#the-ibss-clock-initialisation-static-2026-10-16"
  - id: IBSS-CLK-002
    text: >
      The wrapper at 0x8400dd58 calls it twice: with the mask lo 0x01000001, hi 0x00021030 and flag 1 (gates 0x00, 0x18, 0x24,
      0x2C, 0x2D, 0x31 on), then with the complement 0xFEFFFFFE / 0xFFFDEFCF and flag 0 (every other gate in 0 to 0x33 off). It is
      called from 0x8400deec and, after the base frequency 0x16E3600 (24 000 000) is stored at 0x8401b410 + 0x64 and a clock set-up
      routine is called, from 0x8400e124.
    status: device_disassembly_verified
    evidence: "docs/research/2026-10-16-touch-n88-preconditions.md#the-ibss-clock-initialisation-static-2026-10-16"
  - id: IBSS-CLK-003
    text: >
      Prediction (hypothesis, not an observation): if nothing else changed the gates afterwards, gates 0x00, 0x18, 0x24, 0x2C, 0x2D
      and 0x31 read 0xF and the rest 0. The gates read so far disagree for some: 0x09 to 0x0D, 0x19 and 0x27 read 0xF, so something
      turned them on after this routine, while 0x15 to 0x17 read 0 as predicted.
    status: hypothesis

  - id: IBSS-CLK-004
    text: >
      The single-gate routine 0x8400dcd4 (gate in r0, flag in r1, same array and bound, up to 0xBF100144) has 27 callers. The SPI initialisation
      loop at 0x84007d24 runs over 5 buses (state structures of 0x54 bytes), and for each calls it with [table entry + 0x38] and flag 1, then
      registers the interrupt [table entry + 0x3c]. So the gate field of the SPI table (0x09 to 0x0D) is the index into the same physical array
      as the clock initialisation's, and the iBSS turns all five on. Other callers pass constants: 0x08 (ten calls, in the 0x840089xx to 0x84008axx
      region, on and off), 0x19, 0x1a, 0x1b, 0x21, 0x22, 0x25 (twice), 0x26 (a routine at 0x8400fe3e), 0x2b and 0x2f; the meaning of each block is not
      established here (OpeniBoot puts a NAND controller at 0x26).
    status: device_disassembly_verified
    evidence: "docs/research/2026-10-16-touch-n88-preconditions.md#the-ibss-clock-initialisation-static-2026-10-16"

  - id: IBSS-CLK-005
    text: >
      The three callers of the single-gate routine that take the gate from data were followed: 0x8400242c loops over the array at 0x840179b8
      (first entries 1, 2, 3) and configures pads through gpio_configure with modes 2 and 0 (a UART-style pin initialisation); 0x8400870e
      takes [table + 0x30] in a routine that sets the baud rate 0x1c200 (115200); 0x84007032 passes 0x19 in a routine that polls registers of
      0x89000000. None passes 0x27. The only 0xBF100078 literals in the image are in the two gate routines (0x8400dcfc, 0x8400dd54) and one
      at 0x8400e074 (not followed), so no direct write to the array outside them was found.
    status: device_disassembly_verified
    evidence: "docs/research/2026-10-16-touch-n88-preconditions.md#the-ibss-clock-initialisation-static-2026-10-16"

