  unresolved:
    - id: MT-CHECK-Q1
      text: "Whether the N1 class used for the n88 node calls this routine: it sits in the shared kext, and the N1 personality matches a class of the same kext, but the call chain from AppleMultitouchN1SPI was not traced."
      proof_needed: "follow the callers of 0x8056e4e8 (the bootload path) from the N1 class"
    - id: MT-CHECK-Q2
      text: "Body of slot 0x368 of the SPI device object (the call that performs the exchange, with the arguments listed in MT-CHECK-002): it reads as the transfer by its arguments, but its body is in the platform kext and was not read."
      proof_needed: "disassemble slot 0x368 of AppleARMSPIDevice in AppleARMPlatform"
    - id: MT-CHECK-Q3
      text: "The checksum or framing of the 4 bytes (05 00 00 06): the last byte may be a checksum of the first three plus one, unverified."
      proof_needed: "other packets of the driver and the frame checksum routine"

claims:
  - id: MT-CHECK-001
    text: >
      Builds a four-byte packet on the stack with the bytes 05 00 00 06 (offsets 0 to 3), logs "Sending CHECK
      packet, to see if device is in bootloader", and sends it through the SPI device object at this+0x54 with a
      four-byte receive buffer. On a non-zero status it logs "status: Error 0x%08X sending CHECK". Otherwise, if
      the first received byte is 0xD0 it logs "Driver IS in bootloader" and returns 1, else it logs "Driver is NOT
      in bootloader". The routine takes a retry count: when the answer is not 0xD0 and the count is non-zero it
      waits through an external sleep and calls itself through a virtual slot (0x358) with the count minus one.
    status: device_disassembly_verified
    evidence: "docs/research/2026-10-16-touch-n88-preconditions.md#the-touch-drivers-protocol-static-2026-10-16"

  - id: MT-CHECK-002
    text: >
      The exchange is the call of slot 0x368 on the SPI device object (this+0x54) with the transmit buffer (the
      four packet bytes), a length of 4, a four-byte receive buffer, a receive length of 4 and a zero flag. The
      routine at 0x8056cbd8, called right after with the same two buffers, is a log helper: it copies them into a
      record tagged with the strings "TX" and "RX", it does not perform the transfer.
    status: device_disassembly_verified
    evidence: "docs/research/2026-10-16-touch-n88-preconditions.md#the-touch-drivers-protocol-static-2026-10-16"

