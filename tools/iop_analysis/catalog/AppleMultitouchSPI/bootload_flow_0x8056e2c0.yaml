claims:
  - id: MT-BOOT-001
    text: >
      The bootload timer handler returns without acting if the PowerOnly flag (byte this+0x7d4) is set or if the
      byte this+0x7d2 is set. Otherwise, if the byte this+0x69 (device has firmware) is clear it logs "Device has
      no firmware - will attempt to bootload" and tries the bootload method (slot 0x378) up to three times,
      logging "Bootload attempt %d of %d failed" after each failure. On success it logs "successfully bootloaded
      device", sets this+0x69, calls slot 0x3fc, waits 2 through an external sleep, and calls slot 0x39c (cache the
      device properties), logging "Caching device properties failed" on failure. After three failures it calls
      slot 0x350 to test whether firmware is running anyway; a negative answer logs "No firmware running, and
      couldn't load any". If this+0x69 was already set it logs "Device has firmware?!" and calls slot 0x37c.
    status: device_disassembly_verified
    evidence: "docs/research/2026-10-16-touch-n88-preconditions.md#the-touch-drivers-protocol-static-2026-10-16"
  - id: MT-BOOT-002
    text: >
      The routine at 0x8056e5d8 ("Checking if bootloaded (getting report info)") calls slot 0x3e8 with the report
      code 0xD3 and a four-byte buffer and returns whether the call succeeded. 0xD3 is the code that the iDroid
      Linux driver names MT_INFO_SENSORINFO; the iDroid names for 0xD0, 0xD1, 0xA1 and 0xD9 are likewise among the
      property names the kernelcache driver exposes (Family ID, Sensor Region Descriptor, Sensor Region Param,
      Sensor Surface Width and Height). The report codes are a shared family detail, not a proof of the same
      protocol.
    status: device_disassembly_verified
    evidence: "docs/research/2026-10-16-touch-n88-preconditions.md#the-touch-drivers-protocol-static-2026-10-16"

