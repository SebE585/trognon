# Bestiary: the blocks of the phone that are not fully understood, shown as creatures to face. docs/en/bestiary.md and
# docs/fr/bestiaire.md are GENERATED from this file by tools/bestiary_build.py (make bestiary); `make bestiary-check` validates it.
#
# A creature is a block of the phone. Its "fronts" are the precise open points of the hardware map ("Remaining" column). The life bar is
# COMPUTED from the fronts, never typed in, and a front only moves because a proof is attached to it:
#   open     nothing established: no proof needed
#   wounded  read in firmware or driver code (SOURCE), not yet seen on the phone: needs `ref`, a page of docs/ that holds the reading
#   down     observed on the real phone (DEVICE): needs `evidence`, the bundle(s) under evidence/
# `missions` lists mission ids of tools/iop_analysis/missions.yaml that attack the front (titles come from there). `section` is an anchor of
# docs/en/03-hardware-map.md; a block that is not in the hardware map yet has none and is shown as unspotted.
# A front that is down may also reveal a CODE FRAGMENT of the creature's code (a register value, an identifier): {label, value, proof}. `proof` is a line that must appear, as is, in the
# screen.txt or vars.txt of one of the front's bundles, so a fragment cannot be shown without being in the evidence, and its `value` must itself appear in that line. A front without a fragment
# still counts as down; its slot of the code shows a check mark.
# `goal` (required, both languages) is the BOUNDED victory of the creature: reaching it does not mean the block is understood.
# `story` (optional) is the step of the guided path that tells where the problem comes from; the step opens onto the creature in return.
# A creature with `campaign: true` also gets a campaign page (and then needs `campaign_intro` in both languages). On its fronts:
#   id          a short id, unique in the creature (required on every front of a campaign)
#   needs       ids of the fronts that come first in OUR WORKING ORDER (a plan, not a proven requirement); the front is locked while one is open
#   down_needs  what would bring it down: survey (a run that only reads), write (hardware writes: maintainer only) or unknown
# Any front may also list `ruled_out`: hypotheses shown FALSE, each {text (both languages), ref (a page of docs/) and/or evidence (bundles)}. It is not a state and does not move the
# bar; it is shown under the front because a refutation shortens the search as much as a confirmation does.
# Wording rule: a front says what is established or not, at the strength of its proof. Nothing here is a claim of its own.
creatures:
  - id: wifi
    goal: { en: "Start the coprocessor and get an identified answer from the Wi-Fi chip.", fr: "Démarrer le coprocesseur et obtenir une réponse identifiée de la puce Wi-Fi." }
    name: { en: "The Whisperer", fr: "Le Chuchoteur" }
    block: { en: "Wi-Fi and its coprocessor", fr: "Wi-Fi et son coprocesseur" }
    section: wi-fi-and-sdio
    story: f-wifi
    campaign: true
    campaign_intro:
      en: "The Wi-Fi chip sits behind a coprocessor that we have read about in the firmware but never started. The route goes from understanding its clock, to starting it, to finding out why the main processor's writes to the Wi-Fi registers do not stick."
      fr: "La puce Wi-Fi se trouve derrière un coprocesseur que nous avons lu dans le firmware mais jamais démarré. L'itinéraire va de la compréhension de son horloge, à son démarrage, puis à la raison pour laquelle les écritures du processeur principal dans les registres Wi-Fi ne tiennent pas."
    fronts:
      - id: base
        state: down
        text: { en: "The base address and the GPIO lines of the Wi-Fi block.", fr: "L'adresse de base et les lignes GPIO du bloc Wi-Fi." }
        evidence: [20261015T174633Z-trace_wifi_reset]
        fragment: { label: { en: "The level of the reset line after it is released", fr: "Le niveau de la ligne de reset une fois relâchée" }, value: "1", proof: "RELEASED 00000001" }
      - id: start
        needs: [clock]
        down_needs: write
        state: wounded
        text: { en: "How the coprocessor is started: its start-up sequence, read in the firmware but never run by us.", fr: "Comment le coprocesseur démarre : sa séquence, lue dans le firmware mais jamais exécutée par nous." }
        ref: research/2026-10-16-wifi-iop-architecture.md
        missions: [ARM7M-STARTCPU-Q4, EMBIOP-SEQ-Q1]
      - id: clock
        down_needs: unknown
        state: open
        text: { en: "Which physical clock gate feeds the coprocessor.", fr: "Quelle horloge physique alimente le coprocesseur." }
        missions: [S5L-CLK-Q1, S5L-CLK-Q2]
        ruled_out:
          - text: { en: "That gate 0x27, read as on in an earlier survey, is the coprocessor's: it is the gate of NAND flash controller 1, turned on by the iBSS's NAND driver",
                    fr: "Que la porte 0x27, lue allumée lors d'un relevé précédent, soit celle du coprocesseur : c'est la porte du contrôleur NAND 1, allumée par le pilote NAND de l'iBSS" }
            ref: research/2026-10-16-bringup-dependency-map.md
          - text: { en: "That the gates read when a payload runs are only the six that the iBSS's clock initialisation turns on (0, 0x18, 0x24, 0x2C, 0x2D, 0x31): a survey of all 52 reads 25 on, and gate 0x2D off",
                    fr: "Que les portes lues quand un payload tourne soient seulement les six que l'initialisation d'horloge de l'iBSS allume (0, 0x18, 0x24, 0x2C, 0x2D, 0x31) : un relevé des 52 en lit 25 allumées, et la porte 0x2D éteinte" }
            evidence: [20261020T134724Z-trace_gate_survey]
      - id: sticky
        needs: [start]
        down_needs: unknown
        state: open
        text: { en: "Why writes from the main processor to the Wi-Fi registers do not stick.", fr: "Pourquoi les écritures du processeur principal dans les registres Wi-Fi ne tiennent pas." }

  - id: touch
    goal: { en: "Get an identified answer from the touch controller.", fr: "Obtenir une réponse identifiée du contrôleur tactile." }
    name: { en: "The Shy One", fr: "Le Timide" }
    block: { en: "Touch controller", fr: "Contrôleur tactile" }
    section: touch-controller
    story: f-touch
    fronts:
      - state: down
        text: { en: "The levels of its reset and chip-select lines, and the power registers that look like its supply and clock enables.", fr: "Les niveaux de ses lignes de reset et de sélection, et les registres d'alimentation qui ressemblent à ses commandes de tension et d'horloge." }
        evidence: [20261016T150631Z-trace_touch_gpio, 20261016T173946Z-trace_touch_ldo]
        fragment: { label: { en: "The raw register of its reset line", fr: "Le registre brut de sa ligne de reset" }, value: "0x212", proof: "RST_14.1 raw 00000212" }
      - state: open
        text: { en: "Where its firmware comes from.", fr: "D'où vient son firmware." }
        missions: [MT-BOOT-Q1, MT-CHECK-Q1]
      - state: open
        text: { en: "The polarity of its lines, and powering it.", fr: "La polarité de ses lignes, et sa mise sous tension." }
      - state: open
        text: { en: "Any transaction on its bus, and any answer from it.", fr: "Toute transaction sur son bus, et toute réponse de sa part." }

  - id: bluetooth
    goal: { en: "Identify the Bluetooth chip and get one exchange over its link.", fr: "Identifier la puce Bluetooth et obtenir un échange sur sa liaison." }
    name: { en: "The Sleeper", fr: "Le Dormeur" }
    block: { en: "Bluetooth", fr: "Bluetooth" }
    section: bluetooth
    fronts:
      - state: down
        text: { en: "The levels of its reset and wake lines.", fr: "Les niveaux de ses lignes de reset et de réveil." }
        evidence: [20261016T124101Z-trace_bt_gpio]
        fragment: { label: { en: "The level of its wake line", fr: "Le niveau de sa ligne de réveil" }, value: "0", proof: "bt_wake=00000000" }
      - state: open
        text: { en: "Which chip it is: it is known only from the device tree.", fr: "Quelle puce c'est : on ne la connaît que par le device tree." }
      - state: open
        text: { en: "Its link to the processor (a UART, by the device tree) and any exchange over it.", fr: "Sa liaison avec le processeur (un UART, d'après le device tree) et tout échange dessus." }

  - id: gps
    goal: { en: "Find out which block, if any, carries the GPS.", fr: "Trouver quel bloc, s'il y en a un, porte le GPS." }
    name: { en: "The Unseen", fr: "L'Invisible" }
    block: { en: "GPS", fr: "GPS" }
    fronts:
      - state: open
        text: { en: "Everything: it is not in the hardware map yet. Finding which block, if any, carries it is the first question.", fr: "Tout : il n'est pas encore dans la carte matérielle. Trouver quel bloc le porte, s'il y en a un, est la première question." }

  - id: nand
    goal: { en: "Read one page of the flash on the phone.", fr: "Lire une page de la mémoire flash sur le téléphone." }
    name: { en: "The Vault", fr: "Le Coffre" }
    block: { en: "NAND flash", fr: "Mémoire NAND" }
    section: nand
    story: f-nand
    fronts:
      - state: down
        text: { en: "The chip identifier on the first two chip-enable lines.", fr: "L'identifiant de la puce sur les deux premières lignes de sélection." }
        evidence: [20261015T171033Z-trace_nand]
        fragment: { label: { en: "The chip identifier, first chip", fr: "L'identifiant de la puce, première puce" }, value: "98 DE 95 32 7A 54", proof: "CHIPID 98 DE 95 32 7A 54" }
      - state: open
        text: { en: "The other chip-enable lines, the second bus, and any page access.", fr: "Les autres lignes de sélection, le second bus, et tout accès à une page." }

  - id: accelerometer
    goal: { en: "Name the chip and calibrate its readings.", fr: "Nommer la puce et calibrer ses lectures." }
    name: { en: "The Twitcher", fr: "Le Frétillant" }
    block: { en: "Accelerometer", fr: "Accéléromètre" }
    section: accelerometer
    fronts:
      - state: down
        text: { en: "Its identifier, and axis readings in seven positions (about 56 counts per g on two axes).", fr: "Son identifiant, et des lectures d'axes dans sept positions (environ 56 comptes par g sur deux axes)." }
        evidence: [20261016T101710Z-trace_accel_i2c, 20261016T150615Z-trace_accel_axes]
        fragment: { label: { en: "The identifier byte", fr: "L'octet d'identifiant" }, value: "0x3B", proof: "who_am_i=0000003B" }
      - state: open
        text: { en: "Which of the two compatible chips it is.", fr: "Laquelle des deux puces compatibles c'est." }
      - state: open
        text: { en: "Calibrated offsets and any angular accuracy.", fr: "Les décalages calibrés et toute précision angulaire." }

  - id: magnetometer
    goal: { en: "Get one real measurement from the magnetometer.", fr: "Obtenir une vraie mesure du magnétomètre." }
    name: { en: "The Compass Spirit", fr: "L'Esprit-boussole" }
    block: { en: "Magnetometer", fr: "Magnétomètre" }
    section: magnetometer
    fronts:
      - state: down
        text: { en: "A device at 0x1e whose register readings are compatible with a known chip's documented reset state.", fr: "Un composant en 0x1e dont les lectures de registres sont compatibles avec l'état de reset documenté d'une puce connue." }
        evidence: [20261016T151941Z-trace_compass_i2c]
        fragment: { label: { en: "The address that answers", fr: "L'adresse qui répond" }, value: "0x1E", proof: "aw_1e 00000001" }
      - state: open
        text: { en: "A measurement, which needs a set-up taken from the chip's own memory.", fr: "Une mesure, qui demande une configuration tirée de la mémoire propre de la puce." }
      - state: open
        text: { en: "The role of the silent address 0x1f.", fr: "Le rôle de l'adresse silencieuse 0x1f." }

