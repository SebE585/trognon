name: Pages
on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/pages.yml", "evidence/**", "tools/evidence_index.py", "tools/write_build_commit.py", "tools/iop_analysis/catalog/**", "tools/iop_analysis/missions.yaml", "tools/journey_build.py", "tools/missions_build.py", "tools/verifications.yaml", "tools/verifications_build.py", "tools/rebuild_bundle.py", "tools/iop_analysis/gen_coverage.py", "Makefile"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the verifications check looks commits up in the history
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install mkdocs==1.6.1 mkdocs-material==9.6.16
      - run: make docs-check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
