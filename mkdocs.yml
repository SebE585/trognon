site_name: Trognon
site_description: Open reverse engineering of the iPhone 3GS (S5L8920). Bilingual notes with evidence levels.
site_url: https://sebe585.github.io/trognon/
repo_url: https://github.com/SebE585/trognon
repo_name: SebE585/trognon
docs_dir: docs
site_dir: site
exclude_docs: |
  journal/
  diagrams/
  snippets/
copyright: Documentation CC-BY-SA-4.0 · code GPL-2.0-only / MIT
theme:
  name: material
  font: false
  logo: assets/logo.svg
  favicon: assets/logo.svg
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
extra_css: [assets/extra.css]
extra_javascript: [javascripts/mermaid-palette.js]
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - { name: mermaid, class: mermaid, format: !!python/name:pymdownx.superfences.fence_code_format }
nav:
  - Home: index.md
  - English:
      - Overview: en/README.md
      - 1. Boot chain: en/01-boot-chain.md
      - 2. Exception console: en/02-exception-console.md
      - 3. Hardware map: en/03-hardware-map.md
      - 4. Mods: en/04-mods.md
      - 5. Field notes: en/05-field-notes.md
      - 6. Support by chip: en/06-chips.md
      - 7. Modular code layout: en/07-code-layout.md
      - 8. Evidence: en/08-evidence.md
  - Français:
      - Présentation: fr/README.md
      - 1. Chaîne de démarrage: fr/01-boot-chain.md
      - 2. Console d'exceptions: fr/02-exception-console.md
      - 3. Carte matérielle: fr/03-hardware-map.md
      - 4. Mods: fr/04-mods.md
      - 5. Notes de terrain: fr/05-field-notes.md
      - 6. Support par puce: fr/06-chips.md
      - 7. Code modulaire: fr/07-code-layout.md
      - 8. Preuves: fr/08-evidence.md
  - Research:
      - Index: research/index.md
      - A5/A6, 32-bit: research/2026-10-13-a5-a6-32bit.md
      - A7 to A11, mainline: research/2026-10-13-a7-a11-mainline.md
      - Legal frame: research/2026-10-13-legal-frame.md
      - Untethered boot: research/2026-10-13-untethered-boot.md
      - Pre-A5 and limera1n: research/2026-10-14-pre-a5-limera1n.md
      - Microkernel on the 3GS: research/2026-10-14-microkernel-3gs.md
      - Touch, Wi-Fi, NAND recon: research/2026-10-15-touch-wifi-nand-recon.md
      - OS port comparison: research/2026-10-15-os-port-comparison.md
      - Wi-Fi/IOP architecture: research/2026-10-16-wifi-iop-architecture.md
      - IOP start-up to first sign of life: research/2026-10-16-iop-boot-to-life.md
  - Reference:
      - SoC memory map (S5L8920): spec/soc-s5l8920.md
  - Notes:
      - Architecture (working notes, FR): architecture.md
      - Upstream tools: upstream-tools.md
