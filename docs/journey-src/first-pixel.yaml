nodes:
  - id: start
    kind: start
    title: "A 3GS in a drawer"
    tag: null
    visual: black
    text: |
      You find an iPhone 3GS in a drawer. Its screen is black. You would like your own code to put something on it, and
      nothing written to the phone's storage.

      This is a guided path through what Trognon has actually observed on a phone like this one. Each step says how sure
      we are, and the last ones are the places where our knowledge stops. You can leave at any time for the
      [reference manual](../README.md), or look at the [map of the journey](index.md).
    choices:
      - { text: "Look for a way in", hint: "Understand DFU mode", to: dfu }
      - { text: "Check what will survive a power-off", hint: "Understand why the boot is tethered", to: persist }
      - { text: "Open the Grimoire", hint: "Read the analyses of the phone's own software directly", to: grimoire }

  - id: dfu
    kind: step
    title: "The phone listens: DFU mode"
    visual: cable
    tag: DEVICE
    text: |
      In DFU mode the phone's boot ROM waits for an image over USB instead of starting its system. The ROM of the 3GS
      (S5L8920) has a known flaw, called limera1n, that lets a host turn the signature checks off. The exploit fails some of
      the time and is simply repeated; no helper board is needed.
    evidence: [20261015T050540Z-trace]
    refs:
      - { label: "Boot chain", page: en/01-boot-chain.md }
    choices:
      - { text: "Use the flaw", hint: "See what the exploit gives us", to: pwned }
      - { text: "Check what will survive a power-off", hint: "Understand why the boot is tethered", to: persist }

  - id: pwned
    kind: step
    title: "Signature checks are off"
    visual: unlocked
    tag: DEVICE
    text: |
      After the exploit the boot ROM accepts an image that Apple did not sign. This state is called a pwned DFU. The tool
      is `ipwndfu`, used as it is; the exploit itself is not ours.
    evidence: [20261015T050540Z-trace]
    refs:
      - { label: "Boot chain: the path", page: en/01-boot-chain.md#the-path-device-2026-10-1415 }
    choices:
      - { text: "Send something it will run", hint: "The patched boot stage", to: ibss }

  - id: ibss
    kind: step
    title: "A patched boot stage"
    visual: ibss
    tag: DEVICE
    text: |
      We send the phone's own boot stage (the iBSS), decrypted with the device's own key and patched so that the Recovery
      command `run` jumps to our code. No Apple firmware is stored in this repository: it is taken from the owner's own phone.
      The device then re-enumerates over USB as a Recovery device.
    evidence: [20261015T050540Z-trace]
    refs:
      - { label: "Boot chain: patched iBSS", page: en/01-boot-chain.md#the-path-device-2026-10-1415 }
    choices:
      - { text: "Bring in our own code", hint: "How it gets into the phone's memory", to: payload }

  - id: payload
    kind: step
    screen: 20261015T050540Z-trace
    title: "Our code arrives"
    visual: ram
    tag: DEVICE
    text: |
      `send_data` copies raw Thumb code to `0x41000000` and `run` jumps to it. The code starts with the MMU and caches on, in
      supervisor mode, with interrupts not masked.
    evidence: [20261015T050540Z-trace]
    refs:
      - { label: "Boot chain: payload", page: en/01-boot-chain.md#the-path-device-2026-10-1415 }
      - { label: "Memory layout used by the payloads", page: en/02-exception-console.md#memory-layout-used-by-the-payloads-device }
    choices:
      - { text: "Make sure it really ran", hint: "The marker and the nonce", to: proof }
      - { text: "Check what will survive a power-off", hint: "Understand why the boot is tethered", to: persist }

  - id: proof
    kind: step
    title: "Proof that it ran"
    visual: check
    tag: DEVICE
    text: |
      The code publishes a marker in a variable of the boot stage and the host reads it back. There is a trap: the boot stage
      keeps its variables between runs, so a stale value can look like a result. Trognon therefore appends a random
      32-bit number (a nonce) to every binary and writes an evidence folder only when the number comes back identical.
    evidence: [20261015T050540Z-trace]
    refs:
      - { label: "Evidence: how a bundle is made", page: en/08-evidence.md }
    choices:
      - { text: "Ask for something to see", hint: "Draw on the screen", to: pixel }

  - id: pixel
    kind: step
    screen: 20261015T050542Z-trace_regs
    title: "The first pixel"
    visual: pixel
    tag: DEVICE
    text: |
      The screen is a framebuffer at `0x4fd00000`, 320 by 480 pixels. The display controller was already set up by the boot
      stage, so our code only draws. Because the framebuffer is write-back, the code cleans the data cache after drawing, so
      that a frozen processor still leaves a truthful screen.
    figure: { src: img/console-exceptions.png, alt: "The exception console on the 3GS screen", caption: "The console, rebuilt from the payload's own buffer (not a photograph)." }
    evidence: [20261015T050542Z-trace_regs, 20261015T050540Z-trace]
    refs:
      - { label: "Hardware map: display", page: en/03-hardware-map.md#display }
    choices:
      - { text: "Break something on purpose", hint: "What a crash looks like", to: crash }

  - id: crash
    kind: step
    screen: 20261015T050540Z-trace_pabt
    title: "A crash you can read"
    visual: crash
    tag: DEVICE
    text: |
      The phone has no serial port we can reach and no debugger, so a crash would only reboot it. The console hooks the
      processor's exception vectors, so an undefined instruction, a data abort, a prefetch abort or an interrupt ends in
      a readable dump on the screen, then in a clean return. These four cases were observed on the phone.
    evidence: [20261015T050540Z-trace, 20261015T050541Z-trace_irq]
    refs:
      - { label: "The on-screen exception console", page: en/02-exception-console.md }
    choices:
      - { text: "Go to the edge of what we know", hint: "Where our knowledge stops", to: frontier }

  - id: persist
    kind: side
    title: "Nothing is kept"
    visual: empty
    tag: DEVICE
    text: |
      Nothing survives a restart: the exploit and our code live in RAM and vanish at reboot. This is a tethered boot. When
      the phone shows a logo, it has left Recovery and must be put back in DFU. Making the boot untethered on this chip is
      a hypothesis; the research is written down but nothing has been shown on the phone.
    evidence: [20261015T050540Z-trace]
    refs:
      - { label: "What is not persistent", page: en/01-boot-chain.md#what-is-not-persistent }
      - { label: "Untethered boot (research note)", page: research/2026-10-13-untethered-boot.md }
    choices:
      - { text: "Go back to the drawer", hint: "Return to the start of the path", to: start }
      - { text: "Go to the edge of what we know", hint: "Where our knowledge stops", to: frontier }

  - id: frontier
    kind: frontier-hub
    title: "Here our knowledge stops"
    tag: HYPOTHESIS
    text: |
      Everything above was observed on the phone. Three areas are only partly known. For each one the next pages say what has
      been observed, what is guessed, and what experiment would settle it.

      These pages describe experiments, not procedures. A step that writes to the phone's hardware is only run after a
      written description of the address, the value, the current state and the way back, and an explicit decision.
    refs:
      - { label: "Research index", page: research/index.md }
    choices:
      - { text: "Follow a finger on the screen", hint: "The touch controller", to: f-touch }
      - { text: "Follow the radio", hint: "Wi-Fi and the coprocessor", to: f-wifi }
      - { text: "Follow the data on disk", hint: "Storage, the NAND flash", to: f-nand }
      - { text: "Open the Grimoire", hint: "The kernel's side of these questions", to: grimoire }
      - { text: "Go back to the drawer", hint: "Return to the start of the path", to: start }

  - id: f-touch
    kind: frontier
    creature: touch
    screen: 20261016T225711Z-trace_spi1_selftest2
    title: "Touch: the controller has not answered"
    tag: HYPOTHESIS
    know: |
      The reset and chip-select lines read as outputs driven low. Two PMU registers, read in the driver's code as the touch supply and clock enables, were written and restored.
      With the two registers set, the released reset line reads high; with neither set, it reads low. The SPI block's idle registers were
      read and its clock was already on. A transfer test with no peripheral, using the kernel driver's recipe, moved no counter.
    guess: |
      The SPI clock and data pads may be dedicated pins that need no configuration. The controller may need firmware loaded
      before it answers. A high reset line could come from a board pull-up or from the controller itself.
    next: |
      Establish the SPI controller's transfer recipe with no peripheral (a second test, with OpeniBoot's recipe, is built and
      not run), then a first check packet, to which a first reply byte of `0xD0` would mean the controller is in its loader.
    grimoire: [AppleMultitouchSPI, AppleS5L8900X, AppleD1755]
    notebook: [MT-CHECK-001, MT-BOOT-002, MT-BOOT-Q1]
    corrections:
      - date: "2026-10-16"
        was: "A write to the device tree's clock gate 0x16 made the SPI block readable."
        now: "Withdrawn: the block reads the same with no gate write, and its physical gate, 0x0A, was already on."
        ref: { label: "Which clock-gate numbers are physical", page: research/2026-10-16-touch-n88-preconditions.md#correction-which-clock-gate-numbers-are-physical }
    evidence: [20261016T190939Z-trace_spi1_selftest, 20261016T173946Z-trace_touch_ldo, 20261016T174843Z-trace_spi1_nogate]
    refs:
      - { label: "Hardware map: touch controller", page: en/03-hardware-map.md#touch-controller }
      - { label: "Touch controller preconditions", page: research/2026-10-16-touch-n88-preconditions.md }
    choices:
      - { text: "Look at another open question", hint: "Back to the edge of what we know", to: frontier }

  - id: f-wifi
    kind: frontier
    creature: wifi
    screen: 20261015T174633Z-trace_wifi_reset
    title: "Wi-Fi: the coprocessor has not been started"
    tag: HYPOTHESIS
    know: |
      The Wi-Fi reset line was toggled and read back. Every probed register of the SDIO block reads zero and a written value is
      never read back. The start-up sequence of the embedded coprocessor involved in this path was read in its firmware, and
      that firmware uses the standard SDHCI register layout. A read-only survey of all 52 clock gates and of the clock mask
      registers has since been run: 25 gates read as on, among them `0x27`, which belongs to the flash controller, not to the
      coprocessor. The survey says which gates are on, not whose they are.
    guess: |
      The coprocessor may own the real SDIO window, with the main processor only posting messages to it. Which physical clock
      gate belongs to the SDIO block, and to the coprocessor, is not known: the device tree's gate numbers are not the physical ones.
    next: |
      Find which physical gate feeds the coprocessor. The survey gives states, not owners; how the mask registers relate to
      the gate words has not been studied yet.
    grimoire: [AppleARM7M, EmbeddedIOP, IOP_s5l8920x_firmware]
    notebook: [EMBIOP-SEQ-001, EMBIOP-SEQ-Q1, ARM7M-STARTCPU-Q4]
    corrections:
      - date: "2026-10-16"
        was: "Gate 0x27 read 0xF, so the coprocessor's clock was already on."
        now: "Withdrawn: gate 0x27 is the NAND controller 1's, not the coprocessor's. The coprocessor's clock state is unknown."
        ref: { label: "The iBSS clock initialisation", page: research/2026-10-16-touch-n88-preconditions.md#the-ibss-clock-initialisation-static-2026-10-16 }
      - date: "2026-10-16"
        was: "Enabling the device tree's gate 0x10 alone did not make the SDIO block answer."
        now: "Caveat: the device tree's gate numbers are not physical indexes, so that run may not have enabled the block's clock."
        ref: { label: "Hardware map: Wi-Fi and SDIO", page: en/03-hardware-map.md#wi-fi-and-sdio }
    evidence: [20261015T174633Z-trace_wifi_reset, 20261016T043007Z-trace_write_test, 20261020T134724Z-trace_gate_survey]
    refs:
      - { label: "Hardware map: Wi-Fi and SDIO", page: en/03-hardware-map.md#wi-fi-and-sdio }
      - { label: "Wi-Fi and the coprocessor: architecture", page: research/2026-10-16-wifi-iop-architecture.md }
    choices:
      - { text: "Replay a correction: the false gate", hint: "How a wrong label on a clock gate was caught", to: fg-intro }
      - { text: "Look at another open question", hint: "Back to the edge of what we know", to: frontier }

  - id: f-nand
    kind: frontier
    creature: nand
    screen: 20261015T171033Z-trace_nand
    title: "Storage: only the chip's name"
    tag: HYPOTHESIS
    know: |
      The flash controller answered on two chip-enable lines and returned a chip identifier (Toshiba). Nothing else was read.
    guess: |
      No guess yet: the other chip-enable lines and the second bus have not been probed, so nothing is assumed about them.
    next: |
      A first page read through the controller. It has not been designed yet.
    evidence: [20261015T171033Z-trace_nand]
    refs:
      - { label: "Hardware map: NAND", page: en/03-hardware-map.md#nand }
    choices:
      - { text: "Look at another open question", hint: "Back to the edge of what we know", to: frontier }

  - id: fg-intro
    kind: step
    title: "The False Gate"
    tag: null
    text: |
      Imagine a row of switches with unreliable labels. Inside the phone, a *clock gate* is one of them: it lets the timing
      signal reach a block of the phone, or cuts it off. Finding a switch turned on is not enough: we still need to establish
      which block it belongs to.

      This replays a real correction, made on 16 October 2026. The question: was the clock of the coprocessor behind the
      Wi-Fi, the one the [Whisperer](../bestiary.md#the-whisperer) sleeps behind, already running? Two sheets carry the same
      number, `0x27`.

      - **Sheet 1, the device tree.** A description of the phone's blocks, carried by the phone's own software. Its entry
        for the coprocessor lists a clock-gate value of `0x27`.
      - **Sheet 2, a capture.** Our own code read the phone's gate array at position `0x27` and got `0xF`, which we read as
        "on". This was observed on the phone.

      Someone linked the two: *"coprocessor's clock already on?"* The question mark is small. The rest is very convincing.
    choices:
      - { text: "Start from the map", hint: "Sheet 1 first: what the device tree says", to: fg-map }
      - { text: "Start from the trace", hint: "Sheet 2 first: what the phone answered", to: fg-trace }
      - { text: "Back to the Wi-Fi question", hint: "Return to the edge of what we know", to: f-wifi }

  - id: fg-map
    kind: step
    title: "Following the map"
    tag: DEVICE
    text: |
      The device tree is the phone's own description of itself. If it says the coprocessor's gate is `0x27`, then `0x27` is
      a sensible place to look. That is why the link looked plausible.

      Then the second sheet: the phone's gate array, read at `0x27`, returned `0xF`. Put side by side, the two seem to say
      the same thing: the gate of the coprocessor is on.

      One detail is easy to miss. Both sheets use the same number. Nothing, so far, says they count gates the same way.
    evidence: [20261016T094945Z-trace_iop_clkgate]
    proof:
      - { bundle: 20261016T094945Z-trace_iop_clkgate, line: "gate27=0000000F" }
      - { bundle: 20261016T094945Z-trace_iop_clkgate, line: "GATE+27  0000000F" }
    choices:
      - { text: "Draw a conclusion", hint: "Say what you think this shows", to: fg-conclude }

  - id: fg-trace
    kind: step
    screen: 20261016T094945Z-trace_iop_clkgate
    title: "Following the trace"
    tag: DEVICE
    text: |
      Start from what the phone answered. Our code read the gate array at position `0x27` and the console shows
      `GATE+27  0000000F`. That reading is real: the evidence folder holds it.

      What it shows: that gate reads as on. What it does not show: which block that gate feeds. A reading carries no label.

      Now the device tree: its entry for the coprocessor lists `0x27`. Put side by side, the two seem to line up. Both
      sheets use the same number. Nothing, so far, says they count gates the same way.
    evidence: [20261016T094945Z-trace_iop_clkgate]
    proof:
      - { bundle: 20261016T094945Z-trace_iop_clkgate, line: "gate27=0000000F" }
      - { bundle: 20261016T094945Z-trace_iop_clkgate, line: "GATE+27  0000000F" }
    choices:
      - { text: "Draw a conclusion", hint: "Say what you think this shows", to: fg-conclude }

  - id: fg-conclude
    kind: step
    title: "What do you conclude?"
    tag: null
    text: |
      Decide which sheet your answer rests on before you choose. This page cannot ask you; the next one tells you what each
      answer rests on.
    choices:
      - { text: "The coprocessor's clock is on", hint: "Both sheets say 0x27", to: fg-adopted }
      - { text: "A gate is on; its link to the coprocessor is not established", hint: "A shared number is not a proof", to: fg-doubt }
      - { text: "The reading itself is wrong", hint: "Doubt the capture", to: fg-measure }

  - id: fg-adopted
    kind: step
    title: "You linked the two sheets"
    tag: null
    text: |
      You linked the two sheets. That is exactly what was concluded on the day, and it was plausible: the rest of the
      story is what happens to a plausible link. It rests on one assumption, that the same number means the same gate on
      both sheets, and nothing has shown it yet.

      Time to undo the link, or confirm it. For that, look at what the phone's own code does with gate `0x27`.
    choices:
      - { text: "Open the routine", hint: "What the boot stage does with gate 0x27", to: fg-reveal }

  - id: fg-doubt
    kind: step
    title: "You left the line dotted"
    tag: null
    text: |
      You left the line dotted. Before the decisive clue, that is the right answer: a shared number is a lead, not a link.
      "Not enough to say" is an answer here, and a useful one.

      Now see what settles it. Look at what the phone's own code does with gate `0x27`.
    choices:
      - { text: "Open the routine", hint: "What the boot stage does with gate 0x27", to: fg-reveal }

  - id: fg-measure
    kind: step
    title: "You doubted the capture"
    tag: null
    text: |
      The capture is not contradicted: the code read `0xF`, and the evidence folder holds the reading. What may be wrong is
      not the reading but what we made it say.

      So the question moves from the capture to the meaning of the number. Look at what the phone's own code does with gate
      `0x27`.
    choices:
      - { text: "Open the routine", hint: "What the boot stage does with gate 0x27", to: fg-reveal }

  - id: fg-reveal
    kind: step
    title: "What the boot stage does with gate 0x27"
    tag: SOURCE
    text: |
      The phone's boot stage (the iBSS) contains a routine that resets the flash storage controller. It takes a controller
      number, 0 or 1, and acts on gate `0x26` plus that number. For any other value it logs an error that names the flash
      controller. OpeniBoot, an independent open-source project, names the same two gates: `H2FMI0` for `0x26`, `H2FMI1` for
      `0x27`.

      So, on the physical gate array, gate `0x27` belongs to the **NAND flash controller 1**.

      Two readings agree: our disassembly of the routine, and OpeniBoot's names. Neither was seen running on the phone for
      this purpose. The note below is the catalog entry.
    notebook: [IBSS-CLK-006]
    refs:
      - { label: "The iBSS clock initialisation", page: research/2026-10-16-touch-n88-preconditions.md#the-ibss-clock-initialisation-static-2026-10-16 }
    choices:
      - { text: "Put the sheets side by side", hint: "What this changes", to: fg-resolution }

  - id: fg-resolution
    kind: step
    title: "The reading stands, the label does not"
    tag: SOURCE
    text: |
      The guide lays the two sheets side by side.

      *"Same number. We had not checked that it was the same numbering."*

      On the physical gate array, the reading stands: gate `0x27`, value `0xF`. The attribution does not: that gate feeds the
      NAND controller, not the coprocessor. The guide strikes out "coprocessor" in the reading of the capture, not in the
      device tree. The reading stays; the attribution goes.

      The guide does not correct the phone. The guide corrects what we concluded from its answer.

      *"And the `0x27` on the other sheet?"* It is still there. Whether the device tree uses another numbering that happens
      to give `0x27`, or contains an error, is not shown. It does not make the Wi-Fi work either: the clock state of the
      coprocessor is unknown.
    refs:
      - { label: "Hardware map: Wi-Fi and SDIO", page: en/03-hardware-map.md#wi-fi-and-sdio }
    choices:
      - { text: "Why the old line stays", hint: "What a closed lead leaves behind", to: fg-after }

  - id: fg-after
    kind: step
    title: "A passage condemned, and why"
    tag: null
    text: |
      The withdrawn sentence is still on the [Wi-Fi page](f-wifi.md), struck out and followed by its reason. The
      [Bestiary](../bestiary.md) keeps it as a ruled-out lead on the Whisperer's clock front. A closed lead can be reopened
      by anyone who finds the old map, which is why the correction stays visible, next to what it corrected.

      The Whisperer still keeps its language: which physical gate feeds the coprocessor is not known. Someone after you may
      find it, or may show that the question was framed wrongly.

      If you notice two sheets that disagree, or a page that says more than its proof, [suggest a correction](https://github.com/SebE585/trognon/issues/new?template=correction.yml). A correction is as welcome as a
      discovery. Scout of an inconsistency, archivist of a source, decipherer of a clue, witness of an observation,
      cartographer of a correction: which trace would you leave?
    refs:
      - { label: "Missions: how to take one", page: en/missions.md }
    choices:
      - { text: "Back to the Wi-Fi question", hint: "Return to the edge of what we know", to: f-wifi }
      - { text: "Look at another open question", hint: "Back to the edge of what we know", to: frontier }

  - id: grimoire
    kind: grimoire-hub
    title: "The Grimoire"
    tag: null
    text: |
      The Grimoire is our set of reading notes on the phone's own system software: the kernel extensions and the boot stage,
      decompiled from the owner's own firmware. Each entry says which function does what, which values it uses, what we
      verified and every question we could not close. It is the shortcut for readers who want the kernel's side of the story
      before, or instead of, the observations on the phone.

      Nothing here is Apple's code: an entry records addresses, constants, structure and our conclusions. A claim
      marked *device disassembly verified* was read in the code; it has not necessarily been seen working on the phone, and
      the open questions say what proof is missing.
    refs:
      - { label: "How the analysis is organised", page: research/index.md }
    choices:
      - { text: "Go back to the drawer", hint: "Return to the start of the path", to: start }

grimoire_blurbs:
  AppleARM7M: "The kernel extension that starts the phone's embedded coprocessor (the IOP)."
  IOSlaveProcessor: "A kernel extension of the coprocessor stack."
  EmbeddedIOP: "The kernel extension that prepares the coprocessor's image and starts it."
  IOP_s5l8920x_firmware: "The kernel extension that carries the coprocessor's firmware for this chip."
  AppleD1755: "The kernel extension for the power-management chip, at I2C address `0x74`."
  AppleS5L8900X: "The kernel extension for the SoC's own blocks: the SPI controller, the GPIO pads and the clocks."
  AppleMultitouchSPI: "The kernel extension that talks to the touch controller over SPI."
  iBSS_n88ap_4.3.5: "The phone's boot stage, decrypted on the device: its peripheral tables, GPIO set-up and clock set-up."
