# Version française du parcours « Du téléphone éteint au premier pixel ». Mêmes identifiants et même structure que
# first-pixel.yaml (le contrôle de parité de tools/journey_build.py l'impose) ; seuls les textes changent.
# Les pages de docs/fr/journey/ sont GÉNÉRÉES : ne pas les modifier à la main.
title: "Du téléphone éteint au premier pixel"
lang: fr
start: start
nodes:
  - id: start
    kind: start
    title: "Un 3GS dans un tiroir"
    tag: null
    visual: black
    text: |
      Vous trouvez un iPhone 3GS dans un tiroir. Son écran est noir. Vous aimeriez que votre propre code y affiche quelque
      chose, sans rien écrire dans le stockage du téléphone.

      Ceci est un parcours guidé à travers ce que Trognon a réellement observé sur un téléphone comme celui-ci. Chaque
      étape dit à quel point nous sommes sûrs, et les dernières sont les endroits où notre connaissance s'arrête. Vous
      pouvez partir à tout moment vers le [manuel de référence](../README.md), ou regarder la [carte du parcours](index.md).
    choices:
      - { text: "Chercher un moyen d'entrer", hint: "Comprendre le mode DFU", to: dfu }
      - { text: "Vérifier ce qui survit à l'extinction du téléphone", hint: "Comprendre pourquoi le démarrage est captif", to: persist }
      - { text: "Ouvrir le Grimoire", hint: "Lire directement les analyses du logiciel du téléphone", to: grimoire }

  - id: dfu
    kind: step
    title: "Le téléphone écoute : le mode DFU"
    tag: DEVICE
    visual: cable
    text: |
      En mode DFU, la ROM de démarrage du téléphone attend une image par USB au lieu de lancer son système. La ROM du 3GS
      (S5L8920) a une faille connue, appelée limera1n, qui permet à un hôte de couper les contrôles de signature. L'exploit
      échoue parfois et on le relance simplement ; aucune carte auxiliaire n'est nécessaire.
    evidence: [20261015T050540Z-trace]
    refs:
      - { label: "Chaîne de démarrage", page: fr/01-boot-chain.md }
    choices:
      - { text: "Utiliser la faille", hint: "Voir ce que l'exploit permet", to: pwned }
      - { text: "Vérifier ce qui survit à l'extinction du téléphone", hint: "Comprendre pourquoi le démarrage est captif", to: persist }

  - id: pwned
    kind: step
    title: "Les contrôles de signature sont coupés"
    tag: DEVICE
    visual: unlocked
    text: |
      Après l'exploit, la ROM de démarrage accepte une image qu'Apple n'a pas signée. Cet état s'appelle un DFU « pwned ».
      L'outil est `ipwndfu`, utilisé tel quel ; l'exploit lui-même n'est pas de nous.
    evidence: [20261015T050540Z-trace]
    refs:
      - { label: "Chaîne de démarrage : le chemin", page: fr/01-boot-chain.md#le-chemin-device-2026-10-1415 }
    choices:
      - { text: "Lui envoyer quelque chose à exécuter", hint: "L'étape de démarrage modifiée", to: ibss }

  - id: ibss
    kind: step
    title: "Une étape de démarrage modifiée"
    tag: DEVICE
    visual: ibss
    text: |
      Nous envoyons l'étape de démarrage propre au téléphone (l'iBSS), déchiffrée avec la clé de l'appareil et modifiée pour
      que la commande Recovery `run` saute vers notre code. Aucun firmware d'Apple n'est stocké dans ce dépôt : il est pris sur
      le téléphone de son propriétaire. L'appareil se ré-énumère ensuite en USB comme un appareil Recovery.
    evidence: [20261015T050540Z-trace]
    refs:
      - { label: "Chaîne de démarrage : l'iBSS modifié", page: fr/01-boot-chain.md#le-chemin-device-2026-10-1415 }
    choices:
      - { text: "Faire entrer notre propre code", hint: "Comment il arrive dans la mémoire du téléphone", to: payload }

  - id: payload
    kind: step
    screen: 20261015T050540Z-trace
    title: "Notre code arrive"
    tag: DEVICE
    visual: ram
    text: |
      `send_data` copie du code Thumb brut en `0x41000000` et `run` y saute. Le code démarre avec la MMU et les caches activés,
      en mode superviseur, interruptions non masquées.
    evidence: [20261015T050540Z-trace]
    refs:
      - { label: "Chaîne de démarrage : le payload", page: fr/01-boot-chain.md#le-chemin-device-2026-10-1415 }
      - { label: "Plan mémoire des payloads", page: fr/02-exception-console.md#plan-memoire-des-payloads-device }
    choices:
      - { text: "S'assurer qu'il a vraiment tourné", hint: "Le marqueur et le nonce", to: proof }
      - { text: "Vérifier ce qui survit à l'extinction du téléphone", hint: "Comprendre pourquoi le démarrage est captif", to: persist }

  - id: proof
    kind: step
    title: "La preuve qu'il a tourné"
    tag: DEVICE
    visual: check
    text: |
      Le code publie un marqueur dans une variable de l'étape de démarrage et l'hôte le relit. Il y a un piège : cette étape
      garde ses variables d'une exécution à l'autre, si bien qu'une valeur périmée peut passer pour un résultat. Trognon ajoute
      donc à chaque binaire un nombre aléatoire de 32 bits (un nonce) et n'écrit un dossier de preuve que si ce nombre revient
      identique.
    evidence: [20261015T050540Z-trace]
    refs:
      - { label: "Preuves : comment un dossier est fait", page: fr/08-evidence.md }
    choices:
      - { text: "Faire apparaître quelque chose à l'écran", hint: "Le premier pixel", to: pixel }

  - id: pixel
    kind: step
    screen: 20261015T050542Z-trace_regs
    title: "Le premier pixel"
    tag: DEVICE
    visual: pixel
    text: |
      L'écran est un framebuffer en `0x4fd00000`, de 320 par 480 pixels. Le contrôleur d'affichage avait déjà été réglé par
      l'étape de démarrage : notre code ne fait que dessiner. Comme le framebuffer est en écriture différée, le code nettoie le
      cache de données après avoir dessiné, pour qu'un processeur figé laisse tout de même un écran fidèle.
    figure: { src: img/console-exceptions.png, alt: "La console d'exceptions sur l'écran du 3GS", caption: "La console, reconstituée depuis le tampon du payload (pas une photographie)." }
    evidence: [20261015T050542Z-trace_regs, 20261015T050540Z-trace]
    refs:
      - { label: "Carte matérielle : affichage", page: fr/03-hardware-map.md#affichage }
    choices:
      - { text: "Provoquer un plantage", hint: "À quoi ressemble un plantage lisible", to: crash }

  - id: crash
    kind: step
    screen: 20261015T050540Z-trace_pabt
    title: "Un plantage qu'on peut lire"
    tag: DEVICE
    visual: crash
    text: |
      Le téléphone n'a ni port série accessible ni débogueur : un plantage ne ferait que le redémarrer. La console accroche
      les vecteurs d'exception du processeur, si bien qu'une instruction indéfinie, un abandon de données, un abandon de
      prélecture ou une interruption finit en un vidage lisible à l'écran, puis en un retour propre. Ces quatre cas ont été
      observés sur le téléphone.
    evidence: [20261015T050540Z-trace, 20261015T050541Z-trace_irq]
    refs:
      - { label: "La console d'exceptions à l'écran", page: fr/02-exception-console.md }
    choices:
      - { text: "Voir où s'arrête notre connaissance", hint: "Les questions encore ouvertes", to: frontier }

  - id: persist
    kind: side
    title: "Rien n'est conservé"
    tag: DEVICE
    visual: empty
    text: |
      Rien ne survit à un redémarrage : l'exploit et notre code vivent en RAM et disparaissent au reboot. C'est un démarrage
      captif. Quand le téléphone affiche un logo, il a quitté le mode Recovery et doit être remis en DFU. Rendre le démarrage
      non captif sur cette puce est une hypothèse ; la recherche est écrite mais rien n'a été montré sur le téléphone.
    evidence: [20261015T050540Z-trace]
    refs:
      - { label: "Ce qui ne persiste pas", page: fr/01-boot-chain.md#ce-qui-ne-persiste-pas }
      - { label: "Démarrage non captif (note de recherche, en anglais)", page: research/2026-10-13-untethered-boot.md }
    choices:
      - { text: "Retourner au tiroir", hint: "Revenir au début du parcours", to: start }
      - { text: "Voir où s'arrête notre connaissance", hint: "Les questions encore ouvertes", to: frontier }

  - id: frontier
    kind: frontier-hub
    title: "Ici, notre connaissance s'arrête"
    tag: HYPOTHESIS
    text: |
      Tout ce qui précède a été observé sur le téléphone. Trois domaines ne sont connus qu'en partie. Pour chacun, les pages
      suivantes disent ce qui a été observé, ce qui est supposé, et quelle expérience trancherait.

      Ces pages décrivent des expériences, pas des procédures. Une étape qui écrit dans le matériel du téléphone n'est
      exécutée qu'après une description écrite de l'adresse, de la valeur, de l'état actuel et du retour arrière, et une
      décision explicite.
    refs:
      - { label: "Index de la recherche (en anglais)", page: research/index.md }
    choices:
      - { text: "Suivre un doigt sur l'écran", hint: "Le contrôleur tactile", to: f-touch }
      - { text: "Suivre le signal radio", hint: "Le Wi-Fi et le coprocesseur", to: f-wifi }
      - { text: "Suivre les données stockées", hint: "Le stockage : la mémoire flash NAND", to: f-nand }
      - { text: "Ouvrir le Grimoire", hint: "Ce que dit le noyau sur ces questions", to: grimoire }
      - { text: "Retourner au tiroir", hint: "Revenir au début du parcours", to: start }

  - id: f-touch
    kind: frontier
    screen: 20261016T225711Z-trace_spi1_selftest2
    title: "Tactile : le contrôleur n'a pas répondu"
    tag: HYPOTHESIS
    know: |
      Les lignes de reset et de sélection de puce se lisent comme des sorties pilotées à l'état bas. Deux registres du PMU,
      lus dans le code du pilote comme les commandes d'activation de l'alimentation et de l'horloge du tactile, ont été écrits puis restaurés. Quand ces deux registres sont positionnés, la ligne de reset relâchée se lit à
      l'état haut ; quand ni l'un ni l'autre ne l'est, elle se lit à l'état bas. Les registres au repos du bloc SPI ont été lus et son horloge
      était déjà active. Un test de transfert sans périphérique, avec la recette du pilote du noyau, n'a fait bouger aucun compteur.
    guess: |
      Les broches d'horloge et de données du SPI sont peut-être des broches dédiées qui n'ont besoin d'aucune configuration.
      Le contrôleur a peut-être besoin qu'on charge un firmware avant de répondre. Un niveau haut sur la ligne de reset pourrait
      venir d'un rappel sur la carte ou du contrôleur lui-même.
    next: |
      Établir la recette de transfert du contrôleur SPI sans périphérique (un second test, avec la recette d'OpeniBoot, est
      construit et non lancé), puis un premier paquet de vérification, dont un premier octet de réponse `0xD0` signifierait que
      le contrôleur est dans son chargeur.
    grimoire: [AppleMultitouchSPI, AppleS5L8900X, AppleD1755]
    notebook: [MT-CHECK-001, MT-BOOT-002, MT-BOOT-Q1]
    corrections:
      - date: "2026-10-16"
        was: "Une écriture sur la porte d'horloge 0x16 du device tree rendait le bloc SPI lisible."
        now: "Retiré : le bloc se lit de la même façon sans aucune écriture de porte, et sa porte physique, 0x0A, était déjà active."
        ref: { label: "Quels numéros de portes d'horloge sont physiques (en anglais)", page: research/2026-10-16-touch-n88-preconditions.md#correction-which-clock-gate-numbers-are-physical }
    evidence: [20261016T190939Z-trace_spi1_selftest, 20261016T173946Z-trace_touch_ldo, 20261016T174843Z-trace_spi1_nogate]
    refs:
      - { label: "Carte matérielle : contrôleur tactile (en anglais)", page: en/03-hardware-map.md#touch-controller }
      - { label: "Préconditions du contrôleur tactile (en anglais)", page: research/2026-10-16-touch-n88-preconditions.md }
    choices:
      - { text: "Voir une autre question ouverte", hint: "Retour à la liste des questions ouvertes", to: frontier }

  - id: f-wifi
    kind: frontier
    screen: 20261015T174633Z-trace_wifi_reset
    title: "Wi-Fi : le coprocesseur n'a pas été démarré"
    tag: HYPOTHESIS
    know: |
      La ligne de reset du Wi-Fi a été basculée puis relue. Chaque registre testé du bloc SDIO se lit à zéro et une valeur
      écrite n'est jamais relue. La séquence de démarrage du coprocesseur embarqué impliqué dans ce chemin a été lue dans son
      firmware, et ce firmware utilise la disposition standard de registres SDHCI.
    guess: |
      Le coprocesseur possède peut-être la vraie fenêtre SDIO, le processeur principal ne faisant que lui poster des messages.
      On ne sait pas quelle porte d'horloge physique appartient au bloc SDIO, ni au coprocesseur : les numéros de portes du
      device tree ne sont pas les numéros physiques.
    next: |
      Un relevé en lecture seule de toutes les portes d'horloge et des registres de masque d'horloge est construit et non lancé.
      Il dirait quels blocs sont cadencés avant que rien ne soit démarré.
    grimoire: [AppleARM7M, EmbeddedIOP, IOP_s5l8920x_firmware]
    notebook: [EMBIOP-SEQ-001, EMBIOP-SEQ-Q1, ARM7M-STARTCPU-Q4]
    corrections:
      - date: "2026-10-16"
        was: "La porte 0x27 se lisait 0xF, donc l'horloge du coprocesseur était déjà active."
        now: "Retiré : la porte 0x27 est celle du contrôleur NAND 1, pas du coprocesseur. L'état de l'horloge du coprocesseur est inconnu."
        ref: { label: "L'initialisation d'horloge de l'iBSS (en anglais)", page: research/2026-10-16-touch-n88-preconditions.md#the-ibss-clock-initialisation-static-2026-10-16 }
      - date: "2026-10-16"
        was: "Activer seule la porte 0x10 du device tree n'a pas fait répondre le bloc SDIO."
        now: "Réserve : les numéros de portes du device tree ne sont pas des indices physiques, donc cette exécution n'a peut-être pas activé l'horloge du bloc."
        ref: { label: "Carte matérielle : Wi-Fi et SDIO", page: fr/03-hardware-map.md#wi-fi-et-sdio }
    evidence: [20261015T174633Z-trace_wifi_reset, 20261016T043007Z-trace_write_test]
    refs:
      - { label: "Carte matérielle : Wi-Fi et SDIO", page: fr/03-hardware-map.md#wi-fi-et-sdio }
      - { label: "Le Wi-Fi et le coprocesseur : architecture (en anglais)", page: research/2026-10-16-wifi-iop-architecture.md }
    choices:
      - { text: "Voir une autre question ouverte", hint: "Retour à la liste des questions ouvertes", to: frontier }

  - id: f-nand
    kind: frontier
    screen: 20261015T171033Z-trace_nand
    title: "Stockage : seulement le nom de la puce"
    tag: HYPOTHESIS
    know: |
      Le contrôleur flash a répondu sur deux lignes de sélection de puce et a renvoyé un identifiant de puce (Toshiba). Rien
      d'autre n'a été lu.
    guess: |
      Pas encore de supposition : les autres lignes de sélection et le second bus n'ont pas été sondés, donc rien n'est présumé à leur sujet.
    next: |
      Une première lecture de page par le contrôleur. Elle n'a pas encore été conçue.
    evidence: [20261015T171033Z-trace_nand]
    refs:
      - { label: "Carte matérielle : NAND", page: fr/03-hardware-map.md#nand }
    choices:
      - { text: "Voir une autre question ouverte", hint: "Retour à la liste des questions ouvertes", to: frontier }

  - id: grimoire
    kind: grimoire-hub
    title: "Le Grimoire"
    tag: null
    text: |
      Le Grimoire est notre ensemble de notes de lecture sur le logiciel système du téléphone : les extensions du noyau et
      l'étape de démarrage, décompilées depuis le firmware de son propriétaire. Chaque entrée dit quelle fonction fait quoi,
      quelles valeurs elle emploie, ce que nous avons vérifié et chaque question que nous n'avons pas pu clore. C'est le
      raccourci pour les lecteurs qui veulent lire le système lui-même avant, ou à la place, des observations sur le téléphone.

      Rien ici n'est du code d'Apple : une entrée consigne des adresses, des constantes, une structure et nos conclusions. Une
      affirmation marquée *device disassembly verified* a été lue dans le code ; elle n'a pas forcément été vue fonctionner sur le
      téléphone, et les questions ouvertes disent quelle preuve manque.
    refs:
      - { label: "Comment l'analyse est organisée (en anglais)", page: research/index.md }
    choices:
      - { text: "Retourner au tiroir", hint: "Revenir au début du parcours", to: start }

grimoire_blurbs:
  AppleARM7M: "L'extension du noyau qui démarre le coprocesseur embarqué du téléphone (l'IOP)."
  IOSlaveProcessor: "Une extension du noyau de la pile du coprocesseur."
  EmbeddedIOP: "L'extension du noyau qui prépare l'image du coprocesseur et la démarre."
  IOP_s5l8920x_firmware: "L'extension du noyau qui porte le firmware du coprocesseur pour cette puce."
  AppleD1755: "L'extension du noyau de la puce de gestion d'alimentation, à l'adresse I2C `0x74`."
  AppleS5L8900X: "L'extension du noyau des blocs propres au SoC : le contrôleur SPI, les broches GPIO et les horloges."
  AppleMultitouchSPI: "L'extension du noyau qui parle au contrôleur tactile par SPI."
  iBSS_n88ap_4.3.5: "L'étape de démarrage du téléphone, déchiffrée sur l'appareil : ses tables de périphériques, sa configuration GPIO et d'horloges."
